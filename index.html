<style id="modern-policial-redesign">
  :root{
    --modern-bg:#f5f8fc;
    --modern-panel:#ffffff;
    --modern-border:#e8eef6;
    --modern-muted:#64748b;
    --modern-dark:#07182d;
    --modern-dark-2:#0b2340;

    --modern-green:#16a34a;
    --modern-orange:#f97316;
    --modern-purple:#7c3aed;
    --modern-cyan:#0891b2;

  .modern-logo-title span{display:block;color:#2f7bff;}

  .modern-nav-section{padding:10px 18px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#9fb3c8;}

  .modern-btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(15,23,42,.08);}
  .modern-btn.primary{background:linear-gradient(135deg,#0b63f6,#0753d8);color:white;border-color:#0b63f6;}
  .modern-btn.ghost{background:#fff;color:#0b63f6;}

  .modern-card-title{font-size:18px;font-weight:800;color:#0f172a;}
  .modern-link{font-size:13px;font-weight:700;color:#0b63f6;}

  .modern-chip.pre{background:#dcfce7;color:#15803d;}
  .modern-soft-grid{display:grid;grid-template-columns:2fr 1.45fr 1.35fr;gap:20px;}
  .modern-quick{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;}

  .modern-choice-row:last-child{border-radius:0 0 16px 16px;}
  .modern-choice-row:hover{background:#f8fafc;transform:translateX(2px);}
  .modern-choice-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 auto;}
  .modern-warning-box{border:1px solid #bfdbfe;background:#eff6ff;color:#0753d8;border-radius:12px;padding:12px 14px;font-size:13px;display:flex;gap:10px;align-items:center;}
  .modern-library-hero{background:linear-gradient(135deg,#07182d,#0b63f6);border-radius:24px;color:white;padding:28px;box-shadow:0 24px 55px rgba(11,99,246,.20);}
  .modern-area-card{border:1px solid var(--modern-border);background:#fff;border-radius:18px;padding:20px;text-align:left;transition:.18s ease;}
  .modern-area-card:hover{transform:translateY(-3px);box-shadow:0 14px 28px rgba(15,23,42,.08);}
  @media (max-width:1150px){.modern-soft-grid{grid-template-columns:1fr}.modern-sidebar{width:244px}.modern-quick{grid-template-columns:repeat(3,1fr)}}
  @media (max-width:820px){.modern-sidebar{display:none}.modern-topbar{height:auto;padding:18px}.modern-content{padding:18px}.modern-quick{grid-template-columns:repeat(2,1fr)}}
</style>



<style id="premium-polish-v215">
  /* ===== V2.15 - acabamento visual premium geral ===== */
  body { background: linear-gradient(180deg,#f6f9fd 0%, #eef4fb 100%) !important; }
  #app { background: transparent; }

  /* Cards gerais: mais respiro, sombra suave e consistência */
  .bg-white.rounded-xl.shadow-sm.border.border-gray-100,
  .bg-white.rounded-xl.shadow-sm.border.border-gray-200,
  .bg-white.rounded-xl.border.border-gray-100,
  .bg-white.rounded-xl.border.border-gray-200,
  .modern-card {
    border-radius: 20px !important;
    border-color: #e8eef6 !important;
    box-shadow: 0 12px 32px rgba(15, 23, 42, .055) !important;
    background: rgba(255,255,255,.96) !important;
  }

  .bg-gray-50.rounded-xl,
  .bg-navy-50.rounded-xl,
  .rounded-xl.bg-gray-50,
  .rounded-xl.bg-navy-50 {
    border: 1px solid #e8eef6 !important;
    background: #f8fbff !important;
    border-radius: 18px !important;
  }

  /* Botões: aparência mais premium sem quebrar classes existentes */
  button, .modern-btn { cursor: pointer; }
  main button:not(.sidebar-link),
  #modal-container button,
  .modern-modal button {
    transition: transform .16s ease, box-shadow .16s ease, background .16s ease, border-color .16s ease, color .16s ease;
  }
  main button:not(.sidebar-link):hover,
  #modal-container button:hover,
  .modern-modal button:hover {
    transform: translateY(-1px);
  }
  .bg-accent-600,
  .modern-btn.primary {
    background: linear-gradient(135deg, var(--app-accent-600), var(--app-accent-500)) !important;
    box-shadow: 0 10px 22px rgba(9,103,210,.22) !important;
  }
  .bg-accent-600:hover,
  .hover\:bg-accent-700:hover {
    filter: brightness(.97);
    box-shadow: 0 14px 30px rgba(9,103,210,.28) !important;
  }
  .bg-white.text-navy-700.border,
  .bg-white.text-gray-700.border,
  .bg-white.text-accent-600.border,
  .modern-btn.ghost {
    box-shadow: 0 6px 16px rgba(15,23,42,.045);

  /* Inputs/selects/textarea: mais limpos e consistentes */

  }

  .modern-mini-list-item,
  .border.border-gray-100.rounded-xl.p-4,
  .border.border-gray-200.rounded-xl.p-4,
  .border.border-gray-100.rounded-lg.p-3,
  .border.border-gray-200.rounded-lg.p-3 {

  }
  .tree-item:hover,
  .modern-mini-list-item:hover,
  .border.border-gray-100.rounded-xl.p-4:hover,
  .border.border-gray-200.rounded-xl.p-4:hover,

  /* Estados vazios mais bonitos */

  .text-center.py-12,
  .text-center.py-10,
  .modern-empty {

  .text-center.py-12 .w-16,

    border-collapse: separate !important;
    border-spacing: 0 !important;
    width: 100%;
  }

  th { color:#475569 !important; font-size:12px !important; text-transform:uppercase; letter-spacing:.05em; }
  td, th { border-bottom: 1px solid #edf2f7 !important; }

  .modern-stat-card,
  .grid .bg-white.rounded-xl.shadow-sm.border.border-gray-100.p-4,

  .grid .bg-white.rounded-xl.shadow-sm.border.border-gray-100.p-5:after {
    content:"";
    position:absolute;
    right:-36px;
    top:-36px;
    width:92px;

      adminTab: 'overview',
      adminData: { syllabusTemplates: [], officialSimulations: [], announcements: [] },
      adminStudents: [],
      officialSimulationResults: [],
      authMode: 'login',
      passwordRecovery: false,
      lastBackup: null,
      // Timer state (duration stored in seconds)
      timerRunning: false,
      timerSeconds: 0, // derived elapsed seconds for display
      timerStartEpoch: null, // Date.now() when current run started
      timerAccumulatedSeconds: 0, // seconds accumulated from previous runs
      timerInterval: null
    };

    // Default config
    const defaultConfig = {
      app_title: 'Aprova Policial',
      welcome_message: 'Bem-vindo ao seu sistema de estudos em nuvem',
      primary_color: '#102a43',
      secondary_color: '#0967d2',
      background_color: '#f8fafc',
      text_color: '#1e293b',
      accent_color: '#47a3f3',
      font_family: 'Inter',
      font_size: 16
    };

    let config = { ...defaultConfig };

    // ===== LOCAL STORAGE =====
    function normalizeEmail(email) {
      return String(email || '').trim().toLowerCase();
    }

    function stripExecutableCharacters(value) {
      return String(value ?? '')
        .replace(/[<>]/g, '')
        .replace(/javascript:/gi, '')
        .replace(/data:text\/html/gi, '')
        .replace(/on\w+\s*=/gi, '');
    }

    function sanitizeDeep(value) {
      if (value === null || value === undefined) return value;
      if (typeof value === 'string') return stripExecutableCharacters(value);
      if (typeof value === 'number' || typeof value === 'boolean') return value;
      if (Array.isArray(value)) return value.map(sanitizeDeep);
      if (typeof value === 'object') {
        const clean = {};
        Object.keys(value).forEach(key => {
          clean[key] = sanitizeDeep(value[key]);
        });
        return clean;
      }
      return value;
    }

    function sanitizeProfiles(profiles) {
      return Array.isArray(profiles) ? sanitizeDeep(profiles) : [];
    }

    function safeLinkUrl(url) {
      const raw = String(url || '').trim();
      if (!raw) return '';
      try {
        const parsed = new URL(raw, window.location.origin);
        if (['http:', 'https:', 'mailto:'].includes(parsed.protocol)) return parsed.href;
      } catch (e) {}
      return '';
    }

    function getSafeRedirectUrl() {
      return window.location.origin + window.location.pathname;
    }

    async function processSupabaseAuthRedirect() {
      const query = new URLSearchParams(window.location.search || '');
      const hash = new URLSearchParams((window.location.hash || '').replace(/^#/, ''));
      const code = query.get('code');
      const hasAccessToken = hash.get('access_token');

      try {
        if (code) {
          const { error } = await supabaseClient.auth.exchangeCodeForSession(code);
          if (error) throw error;
          window.history.replaceState({}, document.title, getSafeRedirectUrl());
          return true;
        }

        if (hasAccessToken) {
          window.history.replaceState({}, document.title, getSafeRedirectUrl());
          return true;
        }
      } catch (error) {
        console.error('Erro ao processar confirmação de e-mail:', error);
        window.history.replaceState({}, document.title, getSafeRedirectUrl());
        throw error;
      }

      return false;
    }

    function mapSupabaseUser(user) {
      if (!user) return null;
      return {
        id: user.id,
        name: user.user_metadata?.name || user.user_metadata?.full_name || user.email?.split('@')[0] || 'Aluno',
        email: user.email
      };
    }

    function translateSupabaseError(error) {
      const msg = String(error?.message || error || '').toLowerCase();
      if (msg.includes('email not confirmed')) return 'Confirme seu e-mail antes de fazer login.';
      if (msg.includes('invalid login credentials')) return 'E-mail ou senha inválidos.';
      if (msg.includes('user already registered') || msg.includes('already registered')) return 'Este e-mail já possui cadastro. Faça login.';
      if (msg.includes('password')) return 'Verifique a senha informada e tente novamente.';
      if (msg.includes('rate limit')) return 'Muitas tentativas em pouco tempo. Aguarde alguns instantes e tente novamente.';
      if (msg.includes('beta_limit_reached')) return 'A beta do Aprova Policial atingiu o limite de 10 participantes.';
      return error?.message || 'Ocorreu um erro. Tente novamente.';
    }

    function getLegacyUserStorageKey(email = null) {
      const userEmail = normalizeEmail(email || state.authUser?.email || 'visitante');
      const safe = btoa(unescape(encodeURIComponent(userEmail))).replace(/=+$/,'').replace(/\+/g,'-').replace(/\//g,'_');
      return `${APP_KEY}_${safe}`;
    }

    function getUserStorageKey(email = null) {
      return getLegacyUserStorageKey(email);
    }

    function isAdmin() { return state.userRole === 'admin'; }
    function requireAdminAction(message = 'Esta ação é exclusiva para administradores.') {
      if (isAdmin()) return true;
      alert(message);
      state.adminTab = 'overview';
      if (state.currentScreen === 'admin') state.currentScreen = state.currentContest ? 'contest' : 'profiles';
      render();
      return false;
    }
    function ensureAdminDataShape(data = {}) {
      return {
        syllabusTemplates: Array.isArray(data.syllabusTemplates) ? data.syllabusTemplates : [],
        officialSimulations: Array.isArray(data.officialSimulations) ? data.officialSimulations : [],
        announcements: Array.isArray(data.announcements) ? data.announcements : []
      };
    }
    async function loadUserRole() {
      state.userRole = 'aluno';
      if (!state.authUser?.id) return state.userRole;
      try {
        const { data, error } = await supabaseClient.rpc('is_admin');
        if (error) throw error;
        state.userRole = data === true ? 'admin' : 'aluno';
      } catch (error) {
        console.warn('Não foi possível verificar administrador via public.is_admin().', error);
        state.userRole = 'aluno';
      }
      return state.userRole;
    }
    async function loadPlatformData() {
      state.adminData = ensureAdminDataShape(state.adminData);
      state.adminStudents = [];
      state.officialSimulationResults = [];
      try {
        const { data, error } = await supabaseClient.from('app_platform_data').select('value').eq('key','admin_data').maybeSingle();
        if (!error && data?.value) state.adminData = ensureAdminDataShape(data.value);
      } catch (error) { console.warn('Dados centrais não configurados.', error); }
      try {
        const { data, error } = await supabaseClient.from('app_simulation_results').select('*').order('created_at', { ascending:false });
        if (!error && Array.isArray(data)) state.officialSimulationResults = data;
      } catch (error) { console.warn('Resultados oficiais não configurados.', error); }
      if (isAdmin()) {
        try {
          const { data, error } = await supabaseClient.from('user_app_data').select('user_id,email,profiles,updated_at,created_at').order('updated_at', { ascending:false });
          if (!error && Array.isArray(data)) state.adminStudents = data;
        } catch (error) { console.warn('Visão administrativa de alunos não configurada.', error); }
      }
    }
    async function savePlatformData() {
      if (!isAdmin()) return false;
      state.adminData = ensureAdminDataShape(state.adminData);
      try {
        const payload = { key:'admin_data', value: state.adminData, updated_at: new Date().toISOString() };
        const { error } = await supabaseClient
          .from('app_platform_data')
          .upsert(payload, { onConflict:'key' });
        if (error) throw error;
        return true;
      } catch (error) {
        console.error('Erro ao salvar dados administrativos:', error);
        const details = [error?.message, error?.details, error?.hint].filter(Boolean).join(' | ');
        alert(`Não foi possível salvar dados administrativos no Supabase. Execute as permissões/RLS da tabela app_platform_data. Detalhe: ${details || 'sem detalhe retornado'}`);
        return false;
      }
    }

    function getWeeklyGoalSeconds(contest) {
      const raw = Number(contest?.plan?.weeklyGoal ?? 12);
      const hours = Number.isFinite(raw) && raw > 0 ? raw : 0;
      return Math.round(hours * 3600);
    }

    function getDailyGoalSeconds(contest) {
      const weeklySeconds = getWeeklyGoalSeconds(contest);
      return weeklySeconds > 0 ? Math.round(weeklySeconds / 7) : 0;
    }

    function progressPercent(doneSeconds, goalSeconds) {
      if (!goalSeconds || goalSeconds <= 0) return 0;
      return Math.min(100, Math.round((doneSeconds / goalSeconds) * 100));
    }

    async function claimBetaSeat() {
      const { data, error } = await supabaseClient.rpc('claim_beta_seat');
      if (error) throw error;
      cloudDataRowId = data?.id || cloudDataRowId;
      state.lastBackup = data?.updated_at || data?.created_at || state.lastBackup;
      return data;
    }

    async function loadAuthSession() {
      const recoveryHash = new URLSearchParams((window.location.hash || '').replace(/^#/, ''));
      const recoveryQuery = new URLSearchParams(window.location.search || '');
      state.passwordRecovery = recoveryHash.get('type') === 'recovery' || recoveryQuery.get('type') === 'recovery';

      await processSupabaseAuthRedirect();

      const { data, error } = await supabaseClient.auth.getSession();
      if (error) {
        console.error('Erro ao carregar sessão Supabase:', error);
        state.authUser = null;
        return null;
      }
      const user = data?.session?.user || null;
      state.authUser = mapSupabaseUser(user);
      return state.authUser;
    }

    async function loadFromStorage() {
      if (!state.authUser) {
        state.profiles = [];
        state.lastBackup = null;
        return;
      }

      try {
        let { data, error } = await supabaseClient
          .from('user_app_data')
          .select('id, profiles, updated_at, created_at')
          .eq('user_id', state.authUser.id)
          .maybeSingle();

        if (error) throw error;

        if (!data) {
          data = await claimBetaSeat();
        }

        cloudDataRowId = data?.id || null;
        state.profiles = sanitizeProfiles(data?.profiles);
        state.lastBackup = data?.updated_at || data?.created_at || null;

        // Optional one-time migration from old local beta storage, without keeping passwords.
        const legacyRaw = localStorage.getItem(getLegacyUserStorageKey());
        if ((!state.profiles || state.profiles.length === 0) && legacyRaw) {
          try {
            const legacy = JSON.parse(legacyRaw);
            if (Array.isArray(legacy.profiles) && legacy.profiles.length > 0) {
              state.profiles = sanitizeProfiles(legacy.profiles);
              await persistAppDataNow();
              localStorage.removeItem(getLegacyUserStorageKey());
            }
          } catch (migrationError) {
            console.warn('Não foi possível migrar dados locais antigos:', migrationError);
          }
        }
      } catch (error) {
        console.error('Erro ao carregar dados do usuário:', error);
        if (String(error?.message || '').toLowerCase().includes('beta_limit_reached')) {
          await supabaseClient.auth.signOut();
          state.authUser = null;
          state.profiles = [];
          state.currentScreen = 'login';
          state.authMode = 'login';
          render();
          setTimeout(() => setAuthMessage('error', 'A beta do Aprova Policial atingiu o limite de 10 participantes.'), 50);
          return;
        }
        throw error;
      }
    }

    function saveToStorage() {
      if (!state.authUser) return;
      state.lastBackup = new Date().toISOString();

      clearTimeout(cloudSaveTimer);
      cloudSaveTimer = setTimeout(() => {
        persistAppDataNow().catch(error => {
          console.error('Erro ao salvar dados na nuvem:', error);
        });
      }, 350);
    }

    async function persistAppDataNow() {
      if (!state.authUser) return;
      if (cloudSaveInFlight) {
        cloudSavePending = true;
        return;
      }
      cloudSaveInFlight = true;
      try {
        state.profiles = sanitizeProfiles(state.profiles);
        const payload = {
          profiles: state.profiles,
          email: state.authUser.email,
          updated_at: new Date().toISOString()
        };

        const { data, error } = await supabaseClient
          .from('user_app_data')
          .update(payload)
          .eq('user_id', state.authUser.id)
          .select('id, updated_at')
          .maybeSingle();

        if (error) throw error;

        if (!data) {
          await claimBetaSeat();
          const retry = await supabaseClient
            .from('user_app_data')
            .update(payload)
            .eq('user_id', state.authUser.id)
            .select('id, updated_at')
            .maybeSingle();
          if (retry.error) throw retry.error;
          cloudDataRowId = retry.data?.id || cloudDataRowId;
          state.lastBackup = retry.data?.updated_at || payload.updated_at;
        } else {
          cloudDataRowId = data.id || cloudDataRowId;
          state.lastBackup = data.updated_at || payload.updated_at;
        }

        // Remove legacy auth/user password caches from the old beta implementation.
        localStorage.removeItem(AUTH_KEY);
        localStorage.removeItem(USERS_KEY);
        localStorage.removeItem(getLegacyUserStorageKey());
      } finally {
        cloudSaveInFlight = false;
        if (cloudSavePending) {
          cloudSavePending = false;
          setTimeout(() => persistAppDataNow().catch(error => console.error('Erro ao salvar dados pendentes na nuvem:', error)), 0);
        }
      }
    }

    function setAuthMode(mode) {
      state.authMode = ['login', 'register', 'reset'].includes(mode) ? mode : 'login';
      render();
    }

    function setAuthMessage(type, text) {
      const box = document.getElementById('auth-v218-message');
      if (!box) return;
      box.className = `auth-v218-message show ${type}`;
      box.textContent = text;
    }

    async function betaRegister() {
      const name = document.getElementById('auth-name')?.value.trim();
      const email = normalizeEmail(document.getElementById('auth-email')?.value);
      const password = document.getElementById('auth-password')?.value || '';
      const confirmPassword = document.getElementById('auth-password-confirm')?.value || '';
      const accepted = document.getElementById('auth-terms')?.checked;

      if (!name || !email || !password || !confirmPassword) {
        setAuthMessage('error', 'Preencha nome, e-mail, senha e confirmação de senha.');
        return;
      }
      if (password.length < 6) {
        setAuthMessage('error', 'Use uma senha com pelo menos 6 caracteres.');
        return;
      }
      if (password !== confirmPassword) {
        setAuthMessage('error', 'As senhas digitadas não conferem.');
        return;
      }
      if (!accepted) {
        setAuthMessage('error', 'Confirme que você faz parte do grupo autorizado de testadores da versão beta.');
        return;
      }

      const { data, error } = await supabaseClient.auth.signUp({
        email,
        password,
        options: {
          data: { name },
          emailRedirectTo: getSafeRedirectUrl()
        }
      });

      if (error) {
        setAuthMessage('error', translateSupabaseError(error));
        return;
      }

      state.authUser = null;
      state.currentScreen = 'login';
      state.authMode = 'login';
      render();
      setTimeout(() => {
        setAuthMessage('success', 'Conta criada. Confirme seu e-mail e depois faça login para acessar a beta.');
      }, 50);
    }

    async function betaLogin() {
      const email = normalizeEmail(document.getElementById('auth-email')?.value);
      const password = document.getElementById('auth-password')?.value || '';
      if (!email || !password) {
        setAuthMessage('error', 'Informe e-mail e senha para entrar.');
        return;
      }

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        setAuthMessage('error', translateSupabaseError(error));
        return;
      }

      try {
        // Em algumas combinações de navegador/Supabase, getSession() pode demorar
        // a refletir a sessão. Por isso, usamos diretamente o retorno do login.
        const loggedUser = data?.session?.user || data?.user;
        if (!loggedUser) {
          setAuthMessage('error', 'Login recebido, mas não foi possível identificar o usuário. Atualize a página e tente novamente.');
          return;
        }

        if (data?.session?.access_token && data?.session?.refresh_token) {
          await supabaseClient.auth.setSession({
            access_token: data.session.access_token,
            refresh_token: data.session.refresh_token
          });
        }

        state.authUser = mapSupabaseUser(loggedUser);
        await loadUserRole();
        await loadPlatformData();
        await claimBetaSeat();
        await loadFromStorage();
        state.passwordRecovery = false;
        state.currentScreen = 'profiles';
        render();
      } catch (seatError) {
        console.error('Erro após login:', seatError);
        await supabaseClient.auth.signOut();
        state.authUser = null;
        state.profiles = [];
        state.currentScreen = 'login';
        state.authMode = 'login';
        render();
        setTimeout(() => {
          setAuthMessage('error', translateSupabaseError(seatError));
        }, 50);
      }
    }

    function toggleAuthPassword(inputId, buttonEl) {
      const input = document.getElementById(inputId);
      if (!input) return;
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      if (buttonEl) buttonEl.textContent = isPassword ? 'Ocultar' : 'Mostrar';
    }

    async function betaResetPassword() {
      const email = normalizeEmail(document.getElementById('auth-email')?.value);

      if (state.passwordRecovery) {
        const password = document.getElementById('auth-password')?.value || '';
        const confirmPassword = document.getElementById('auth-password-confirm')?.value || '';

        if (!password || !confirmPassword) {
          setAuthMessage('error', 'Informe a nova senha e a confirmação.');
          return;
        }
        if (password.length < 6) {
          setAuthMessage('error', 'Use uma nova senha com pelo menos 6 caracteres.');
          return;
        }
        if (password !== confirmPassword) {
          setAuthMessage('error', 'As senhas digitadas não conferem.');
          return;
        }

        const { error } = await supabaseClient.auth.updateUser({ password });
        if (error) {
          setAuthMessage('error', translateSupabaseError(error));
          return;
        }

        await supabaseClient.auth.signOut();
        state.passwordRecovery = false;
        state.authUser = null;
        state.authMode = 'login';
        state.currentScreen = 'login';
        render();
        setTimeout(() => setAuthMessage('success', 'Senha atualizada. Faça login novamente.'), 50);
        return;
      }

      if (!email) {
        setAuthMessage('error', 'Informe seu e-mail para receber o link de redefinição.');
        return;
      }

      const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: getSafeRedirectUrl()
      });

      if (error) {
        setAuthMessage('error', translateSupabaseError(error));
        return;
      }

      setAuthMessage('success', 'Enviamos um link seguro de redefinição para o seu e-mail.');
    }

    async function betaLogout() {
      try {
        clearTimeout(cloudSaveTimer);
        await persistAppDataNow();
      } catch (error) {
        console.warn('Não foi possível salvar antes de sair:', error);
      }
      await supabaseClient.auth.signOut();
      state.authUser = null;
      state.currentProfile = null;
      state.currentContest = null;
      state.profiles = [];
      state.currentScreen = 'login';
      state.authMode = 'login';
      state.passwordRecovery = false;
      cloudDataRowId = null;
      render();
    }

    // ===== UTILITY FUNCTIONS =====
    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).substr(2);
    }

    }

function getCurrentContest() {
  const profile = state.profiles.find(p => p.id === state.currentProfile);
  return profile?.contests?.find(c => c.id === state.currentContest) || null;
}

function getTopicById(contest, topicId) {
  return contest?.syllabus?.find(t => t.id === topicId) || null;
}

function getSubtopicById(topic, subtopicId) {
  return topic?.subtopics?.find(st => st.id === subtopicId) || null;
}

function updateTopicAggregates(contest, topicId) {
  // Recompute topic question stats from all question blocks tied to the topic (including subtópicos)
  const topic = getTopicById(contest, topicId);
  if (!topic) return;
  const blocks = (contest.questions || []).filter(q => q.topicId === topicId);
  const total = blocks.reduce((acc, q) => acc + (q.total || 0), 0);
  const correct = blocks.reduce((acc, q) => acc + (q.correct || 0), 0);
  topic.questions = total;
  topic.accuracy = total > 0 ? Math.round((correct / total) * 100) : 0;

  // Aggregate time from subtópicos (timeSpent is stored in minutes) + keep existing topic.timeSpent (which may include direct time)
  if (Array.isArray(topic.subtopics) && topic.subtopics.length > 0) {
    const subMin = topic.subtopics.reduce((acc, st) => acc + (st.timeSpent || 0), 0);
    // If topic.timeSpent already includes subtópicos (because we add to it), keep it; otherwise ensure minimum equals subMin
    topic.timeSpent = Math.max(topic.timeSpent || 0, subMin);
  }
}

function updateSubtopicStats(contest, topicId, subtopicId) {
  const topic = getTopicById(contest, topicId);
  const sub = getSubtopicById(topic, subtopicId);
  if (!topic || !sub) return;
  const blocks = (contest.questions || []).filter(q => q.topicId === topicId && q.subtopicId === subtopicId);
  const total = blocks.reduce((acc, q) => acc + (q.total || 0), 0);
  const correct = blocks.reduce((acc, q) => acc + (q.correct || 0), 0);
  sub.questions = total;
  sub.accuracy = total > 0 ? Math.round((correct / total) * 100) : 0;
}



function recomputeTopicNextReview(topic) {
  if (!topic) return;
  const dates = [];
  if (topic.nextReview) dates.push(topic.nextReview);
  (topic.subtopics || []).forEach(st => { if (st.nextReview) dates.push(st.nextReview); });
  if (dates.length === 0) {
    topic.nextReview = null;
    return;
  }
  const minIso = dates
    .map(d => ({ iso: d, t: new Date(d).getTime() }))
    .filter(o => !Number.isNaN(o.t))
    .sort((a,b) => a.t - b.t)[0]?.iso;
  topic.nextReview = minIso || topic.nextReview || null;
}

function syncNextReviews(contest) {
  if (!contest) return;
  const syllabus = contest.syllabus || [];
  syllabus.forEach(t => {
    t.nextReview = null;
    (t.subtopics || []).forEach(st => { st.nextReview = null; });
  });

  const pending = (contest.reviews || []).filter(r => !r.completed && r.dueDate);
  pending.forEach(r => {
    const topic = syllabus.find(t => t.id === r.topicId);
    if (!topic) return;
    if (r.subtopicId) {
      const st = (topic.subtopics || []).find(s => s.id === r.subtopicId);
      if (st) {
        if (!st.nextReview || new Date(r.dueDate).getTime() < new Date(st.nextReview).getTime()) st.nextReview = r.dueDate;
      }
    } else {
      if (!topic.nextReview || new Date(r.dueDate).getTime() < new Date(topic.nextReview).getTime()) topic.nextReview = r.dueDate;
    }
  });

  syllabus.forEach(t => recomputeTopicNextReview(t));
}

function getWeekRange(weekOffset = 0) {
  const now = new Date();
  const start = new Date(now);
  start.setHours(0,0,0,0);
  start.setDate(start.getDate() - start.getDay() + (weekOffset * 7));
  const end = new Date(start);
  end.setDate(end.getDate() + 7);
  return { start, end };
}

function isDateInRange(dateLike, start, end) {
  const d = new Date(dateLike);
  return d >= start && d < end;
}

function getContestReportView(contest) {
  contest.reportView = contest.reportView || { mode: 'pre', weekOffset: 0 };
  if (!['pre','post'].includes(contest.reportView.mode)) contest.reportView.mode = 'pre';
  if (typeof contest.reportView.weekOffset !== 'number') contest.reportView.weekOffset = 0;
  return contest.reportView;
}

function setReportMode(mode) {
  const contest = getCurrentContest();
  if (!contest) return;
  const view = getContestReportView(contest);
  view.mode = mode === 'post' ? 'post' : 'pre';
  saveToStorage();
  render();
}

function changeReportWeek(delta) {
  const contest = getCurrentContest();
  if (!contest) return;
  const view = getContestReportView(contest);
  view.weekOffset += delta;
  saveToStorage();
  render();
}

function resetReportWeek() {
  const contest = getCurrentContest();
  if (!contest) return;
  const view = getContestReportView(contest);
  view.weekOffset = 0;
  saveToStorage();
  render();
}


function toISODateOnly(dateLike) {
  const d = new Date(dateLike);
  if (Number.isNaN(d.getTime())) return '';
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function getDateFromISODateOnly(iso) {
  if (!iso) return null;
  const [y, m, d] = iso.split('-').map(Number);
  if (!y || !m || !d) return null;
  return new Date(y, m - 1, d);
}

function formatMonthYear(dateLike) {
  return new Date(dateLike).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }).replace(/^./, c => c.toUpperCase());
}

function getReportViewState(contest) {
  contest.reportView = contest.reportView || {};
  const view = contest.reportView;
  if (!['week', 'month', 'custom'].includes(view.periodType)) view.periodType = 'week';
  if (typeof view.weekOffset !== 'number') view.weekOffset = 0;
  if (typeof view.monthOffset !== 'number') view.monthOffset = 0;
  if (!view.customStart) view.customStart = toISODateOnly(new Date());
  if (!view.customEnd) view.customEnd = toISODateOnly(new Date());
  return view;
}

function getReportRange(contest) {
  const view = getReportViewState(contest);
  if (view.periodType === 'month') {
    const now = new Date();
    const start = new Date(now.getFullYear(), now.getMonth() + view.monthOffset, 1);
    start.setHours(0,0,0,0);
    const end = new Date(start.getFullYear(), start.getMonth() + 1, 1);
    return { start, end, label: formatMonthYear(start), calendarDate: start };
  }
  if (view.periodType === 'custom') {
    let start = getDateFromISODateOnly(view.customStart) || new Date();
    let endBase = getDateFromISODateOnly(view.customEnd) || start;
    start.setHours(0,0,0,0);
    endBase.setHours(0,0,0,0);
    if (endBase < start) {
      const tmp = start;
      start = endBase;
      endBase = tmp;
    }
    const end = new Date(endBase);
    end.setDate(end.getDate() + 1);
    return { start, end, label: `${formatDate(start)} — ${formatDate(endBase)}`, calendarDate: start };
  }
  const range = getWeekRange(view.weekOffset || 0);
  const endDisplay = new Date(range.end.getTime() - 86400000);
  return { start: range.start, end: range.end, label: `${formatDate(range.start)} — ${formatDate(endDisplay)}`, calendarDate: range.start };
}

function setReportPeriodType(type) {
  const contest = getCurrentContest();

function changeReportPeriod(delta) {
  const contest = getCurrentContest();
  if (!contest) return;
  const view = getReportViewState(contest);
  if (view.periodType === 'month') {
    view.monthOffset += delta;
  } else if (view.periodType === 'custom') {
    const start = getDateFromISODateOnly(view.customStart) || new Date();
    const end = getDateFromISODateOnly(view.customEnd) || start;
    const days = Math.max(1, Math.round((end - start) / 86400000) + 1);
    start.setDate(start.getDate() + (delta * days));
    end.setDate(end.getDate() + (delta * days));
    view.customStart = toISODateOnly(start);
    view.customEnd = toISODateOnly(end);
  } else {
    view.weekOffset += delta;
  }
  saveToStorage();
  render();
}

function hexToRgb(hex) {
  const raw = hex.replace('#','');
  const full = raw.length === 3 ? raw.split('').map(c => c+c).join('') : raw;
  const num = parseInt(full, 16);
  return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
}

function rgba(hex, alpha) {
  const {r,g,b} = hexToRgb(hex);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

function describeArc(cx, cy, r, startAngle, endAngle) {
  const rad = Math.PI / 180;
  const start = {
    x: cx + r * Math.cos((startAngle - 90) * rad),
    y: cy + r * Math.sin((startAngle - 90) * rad)
  };
  const end = {
    x: cx + r * Math.cos((endAngle - 90) * rad),
    y: cy + r * Math.sin((endAngle - 90) * rad)
  };
  const largeArc = endAngle - startAngle <= 180 ? 0 : 1;
  return `M ${cx} ${cy} L ${start.x} ${start.y} A ${r} ${r} 0 ${largeArc} 1 ${end.x} ${end.y} Z`;
}

function renderPieChartSvg(data, title, emptyText) {
  const palette = ['#0967d2','#7c3aed','#059669','#d97706','#dc2626','#0891b2','#84cc16','#f43f5e'];
  if (!data || data.length === 0) {
    return `<div class="text-center py-10 text-gray-500">${emptyText}</div>`;
  }
  const total = data.reduce((acc, item) => acc + item.value, 0);
  let currentAngle = 0;
  const slices = data.map((item, idx) => {
    const angle = total > 0 ? (item.value / total) * 360 : 0;
    const path = describeArc(80, 80, 70, currentAngle, currentAngle + angle);
    const color = palette[idx % palette.length];
    currentAngle += angle;
    return `<path d="${path}" fill="${color}" opacity="0.95"><title>${item.label}: ${item.display || item.value}</title></path>`;
  }).join('');

  return `
    <div class="grid grid-cols-1 md:grid-cols-[170px,1fr] gap-4 items-center">
      <div class="flex items-center justify-center">
        <svg width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="${title}">
          ${slices}
          <circle cx="80" cy="80" r="34" fill="white"></circle>
          <text x="80" y="76" text-anchor="middle" class="fill-slate-700" font-size="12" font-weight="600">Total</text>
          <text x="80" y="94" text-anchor="middle" class="fill-slate-900" font-size="13" font-weight="700">${data.length}</text>
        </svg>
      </div>
      <div class="space-y-2">
        ${data.map((item, idx) => {
          const color = palette[idx % palette.length];
          const pct = total > 0 ? Math.round((item.value / total) * 100) : 0;
          return `
            <div class="flex items-center justify-between gap-3 text-sm">
              <div class="flex items-center gap-2 min-w-0">
                <span class="w-3 h-3 rounded-full" style="background:${color}"></span>
                <span class="text-navy-700 truncate">${item.label}</span>
              </div>
              <div class="text-right whitespace-nowrap">
                <span class="font-medium text-navy-900">${item.display || item.value}</span>
                <span class="text-gray-400 ml-1">(${pct}%)</span>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

function saveManualSession() {
  const profile = state.profiles.find(p => p.id === state.currentProfile);
  const contest = profile?.contests?.find(c => c.id === state.currentContest);
  if (!contest) return;

  const topicSelect = document.getElementById('manual-session-topic');
  const subtopicSelect = document.getElementById('manual-session-subtopic');
  const typeSelect = document.getElementById('manual-session-type');
  const hoursInput = document.getElementById('manual-session-hours');
  const minutesInput = document.getElementById('manual-session-minutes');
  const secondsInput = document.getElementById('manual-session-seconds');

  const topicId = topicSelect?.value || null;
  const subtopicId = subtopicSelect?.value || null;
  const hours = parseInt(hoursInput?.value || '0', 10) || 0;
  const minutes = parseInt(minutesInput?.value || '0', 10) || 0;
  const seconds = parseInt(secondsInput?.value || '0', 10) || 0;

  const totalSeconds = Math.max(0, (hours * 3600) + (minutes * 60) + seconds);
  if (!topicId || totalSeconds <= 0) {
    showNiceInfo('Sessão incompleta', 'Selecione um tópico e informe um tempo maior que zero.');
    return;
  }

  const topic = contest.syllabus?.find(t => t.id === topicId);
  const subtopic = (topic && subtopicId) ? (topic.subtopics || []).find(st => st.id === subtopicId) : null;

  const session = {
    id: generateId(),
    topicId,
    topicName: topic?.name || 'Sem tópico',
    subtopicId,
    subtopicName: subtopic?.name || null,
    type: typeSelect?.value || 'theory',
    duration: totalSeconds,
    date: new Date().toISOString(),
    planMode: getActiveContestMode(contest),
    manualEntry: true
  };

  contest.sessions = contest.sessions || [];
  contest.sessions.unshift(session);

  if (topic) {
    topic.timeSpent = (topic.timeSpent || 0) + Math.round(totalSeconds / 60);
    topic.lastStudied = new Date().toISOString();

    if (subtopic) {
      subtopic.timeSpent = (subtopic.timeSpent || 0) + Math.round(totalSeconds / 60);
      subtopic.lastStudied = new Date().toISOString();
    }

    if ((typeSelect?.value || 'theory') === 'theory') {
      const intervals = contest.reviewSettings?.intervals || [1, 7, 30];
      const reviewDate = new Date();
      reviewDate.setDate(reviewDate.getDate() + intervals[0]);
      createManualReview(contest, topicId, subtopic ? subtopic.id : null, reviewDate.toISOString());
    }
  }

  if (subtopicId) updateSubtopicStats(contest, topicId, subtopicId);
  updateTopicAggregates(contest, topicId);
  saveToStorage();
  render();
}

function createManualReview(contest, topicId, subtopicId, dueDateIso) {
  if (!contest) return;
  const topic = getTopicById(contest, topicId);
  if (!topic) return;
  const sub = subtopicId ? getSubtopicById(topic, subtopicId) : null;

  contest.reviews = contest.reviews || [];
  contest.reviews.push({
    id: generateId(),
    topicId,
    topicName: topic.name,
    subtopicId: sub ? sub.id : null,
    subtopicName: sub ? sub.name : null,
    dueDate: dueDateIso,
    completed: false,
    interval: 0
  });

  // Store nextReview at the most specific level
  if (sub) {
    sub.nextReview = dueDateIso;
  } else {
    topic.nextReview = dueDateIso;
  }

  // Also keep topic.nextReview as the nearest review among its subtopics / itself
  syncNextReviews(contest);
}

    function renderLoginScreen() {
      const isRegister = state.authMode === 'register';
      const isReset = state.authMode === 'reset';

      return `

          <div class="auth-v218-brand">
            <div>
              <div class="auth-v218-logo">
                <div class="auth-v218-mark">${icons.shield}</div>
                <div class="auth-v218-title">APROVA<span>POLICIAL</span></div>
              </div>
              <div class="auth-v218-hero">

                <p>Entre para acessar seus perfis, editais verticalizados, cronômetro, revisões e estatísticas em uma experiência preparada para a versão online.</p>
                <div class="auth-v218-points">
                  <div class="auth-v218-point"><strong>Planejamento Inteligente</strong><span>Estruture sua preparação com clareza e estratégia.</span></div>
                  <div class="auth-v218-point"><strong>Evolução Mensurável</strong><span>Acompanhe seu desempenho e identifique oportunidades de melhoria.</span></div>
                  <div class="auth-v218-point"><strong>Revisões Programadas</strong><span>Nunca perca o momento certo de revisar um conteúdo.</span></div>
                </div>
              </div>
            </div>
            <div class="auth-v218-footer">© Aprova Policial Beta • Organização para quem leva a aprovação a sério.</div>
          </div>

          <div class="auth-v218-panel-wrap">
            <div class="auth-v218-panel">
              <div class="auth-v218-panel-head">
                <div class="mini">${isReset ? icons.refresh : icons.target}</div>
                <h2>${panelTitle}</h2>
                <p>${panelSubtitle}</p>
              </div>

              ${!isReset ? `
                <div class="auth-v218-tabs">
                  <button class="auth-v218-tab ${!isRegister ? 'active' : ''}" onclick="setAuthMode('login')">Entrar</button>
                  <button class="auth-v218-tab ${isRegister ? 'active' : ''}" onclick="setAuthMode('register')">Criar conta</button>
                </div>
              ` : ''}

              <div id="auth-v218-message" class="auth-v218-message"></div>

              ${isRegister ? `
                <div class="auth-v218-field">
                  <label for="auth-name">Nome do candidato</label>
                  <input id="auth-name" class="auth-v218-input" type="text" placeholder="Ex.: Ítalo Wigliff" autocomplete="name">
                </div>
              ` : ''}

              <div class="auth-v218-field">
                <label for="auth-email">E-mail</label>
                <input id="auth-email" class="auth-v218-input" type="email" placeholder="seuemail@exemplo.com" autocomplete="email">
              </div>

              ${(!isReset || state.passwordRecovery) ? `
                <div class="auth-v218-field">
                  <label for="auth-password">${isReset ? 'Nova senha' : 'Senha'}</label>
                  <div class="auth-v218-password-wrap">
                    <input id="auth-password" class="auth-v218-input" type="password" placeholder="Mínimo de 6 caracteres" autocomplete="${isRegister || isReset ? 'new-password' : 'current-password'}" onkeydown="if(event.key==='Enter'){${isReset ? 'betaResetPassword()' : (isRegister ? 'betaRegister()' : 'betaLogin()')}}}">
                    <button type="button" class="auth-v218-eye" onclick="toggleAuthPassword('auth-password', this)">Mostrar</button>
                  </div>
                </div>
              ` : ''}

              ${(isRegister || (isReset && state.passwordRecovery)) ? `
                <div class="auth-v218-field">
                  <label for="auth-password-confirm">Confirmar senha</label>
                  <div class="auth-v218-password-wrap">
                    <input id="auth-password-confirm" class="auth-v218-input" type="password" placeholder="Digite novamente sua senha" autocomplete="new-password" onkeydown="if(event.key==='Enter'){${isReset ? 'betaResetPassword()' : 'betaRegister()'}}">
                    <button type="button" class="auth-v218-eye" onclick="toggleAuthPassword('auth-password-confirm', this)">Mostrar</button>
                  </div>
                </div>
              ` : ''}

              ${isRegister ? `
                <label class="auth-v218-check">
                  <input id="auth-terms" type="checkbox">
                  <span>Confirmo que faço parte do grupo autorizado de testadores da versão beta.</span>
                </label>

              ${!isRegister && !isReset ? `
                <div class="auth-v218-row">
                  <span></span>
                  <button type="button" class="auth-v218-small-link" onclick="setAuthMode('reset')">Esqueci minha senha</button>

              <button class="auth-v218-submit" onclick="${isReset ? 'betaResetPassword()' : (isRegister ? 'betaRegister()' : 'betaLogin()')}">
                ${isReset ? (state.passwordRecovery ? 'Atualizar senha' : 'Enviar link de redefinição') : (isRegister ? 'Criar minha conta beta' : 'Entrar agora')}

              ${isReset ? `
                <button class="auth-v218-secondary" onclick="setAuthMode('login')">Voltar para o login</button>

              </p>
            </div>
          </div>

      `;
    }

    function appendAuthUserbar() {
      if (!state.authUser || state.currentScreen === 'login' || state.passwordRecovery) return;
      const app = document.getElementById('app');
      if (!app || document.getElementById('auth-v218-userbar')) return;
      const bar = document.createElement('div');
      bar.id = 'auth-v218-userbar';
      bar.className = 'auth-v218-userbar';
      bar.innerHTML = `<span>${escapeHtml(state.authUser.name || state.authUser.email)}</span><button onclick="betaLogout()">Sair</button>`;
      app.appendChild(bar);
    }

    function render() {
      const app = document.getElementById('app');

      if (!state.authUser || state.passwordRecovery) {
        state.currentScreen = 'login';
      }
      
      if (state.currentScreen === 'login') {
        app.innerHTML = renderLoginScreen();
      } else if (state.currentScreen === 'profiles') {
        app.innerHTML = renderProfilesScreen();
      } else if (state.currentScreen === 'profileHome') {
        app.innerHTML = renderProfileHomeScreen();
      } else if (state.currentScreen === 'admin') {
        app.innerHTML = renderAdminScreen();
      } else if (state.currentScreen === 'contest') {
        app.innerHTML = renderContestScreen();
      }
      
      attachEventListeners();
      applyCurrentAppearance();
      appendAuthUserbar();
    }

    async function openAdminPanel(tab = 'overview') {
      if (!isAdmin()) { alert('Esta área é exclusiva para administradores.'); return; }
      state.adminTab = tab;
      state.currentScreen = 'admin';
      await loadPlatformData();
      render();
    }
    function adminStatTotals() {
      const rows = Array.isArray(state.adminStudents) ? state.adminStudents : [];
      const allProfiles = rows.flatMap(r => Array.isArray(r.profiles) ? r.profiles : []);
      const allContests = allProfiles.flatMap(p => Array.isArray(p.contests) ? p.contests : []);
      const sessions = allContests.flatMap(c => Array.isArray(c.sessions) ? c.sessions : []);
      const questions = allContests.flatMap(c => Array.isArray(c.questions) ? c.questions : []);
      const totalSeconds = sessions.reduce((a,s)=>a+(Number(s.duration)||0),0);
      const totalQuestions = questions.reduce((a,q)=>a+(Number(q.total)||0),0);
      const totalCorrect = questions.reduce((a,q)=>a+(Number(q.correct)||0),0);
      const active7 = rows.filter(r => { const d = new Date(r.updated_at || r.created_at || 0); const w = new Date(); w.setDate(w.getDate()-7); return d >= w; }).length;
      return { students: rows.length, contests: allContests.length, sessions: sessions.length, totalSeconds, totalQuestions, accuracy: totalQuestions ? Math.round(totalCorrect/totalQuestions*100) : 0, active7 };
    }
    function adminStatCard(label, value, sub) { return `<div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5"><p class="text-sm text-gray-500">${label}</p><p class="text-2xl font-black text-navy-900 mt-1">${value}</p><p class="text-xs text-gray-400 mt-1">${sub}</p></div>`; }
    function renderAdminStudentsTable() {
      const rows = (state.adminStudents || []).slice(0, 12);
      if (!rows.length) return '<p class="text-sm text-gray-500">Ainda não há dados de alunos visíveis. Depois de configurar a política no Supabase, os alunos aparecerão aqui.</p>';
      return `<div class="overflow-x-auto"><table class="w-full"><thead><tr><th class="text-left">Aluno</th><th>Perfis</th><th>Concursos</th><th>Horas</th><th>Questões</th><th>Atualização</th></tr></thead><tbody>${rows.map(r=>{ const profiles=Array.isArray(r.profiles)?r.profiles:[]; const contests=profiles.flatMap(p=>Array.isArray(p.contests)?p.contests:[]); const secs=contests.reduce((a,c)=>a+(Array.isArray(c.sessions)?c.sessions.reduce((s,x)=>s+(Number(x.duration)||0),0):0),0); const qs=contests.reduce((a,c)=>a+(Array.isArray(c.questions)?c.questions.reduce((q,x)=>q+(Number(x.total)||0),0):0),0); return `<tr><td class="py-3 font-semibold text-navy-900">${escapeHtml(r.email || r.user_id)}</td><td class="text-center">${profiles.length}</td><td class="text-center">${contests.length}</td><td class="text-center">${formatTime(secs)}</td><td class="text-center">${qs}</td><td class="text-center text-sm text-gray-500">${r.updated_at ? formatDate(r.updated_at) : '-'}</td></tr>`; }).join('')}</tbody></table></div>`;
    }
    function renderAdminScreen(embedded = false) {
      if (!isAdmin()) return '<div class="p-6">Área restrita.</div>';
      state.adminData = ensureAdminDataShape(state.adminData);
      const totals = adminStatTotals();
      const tab = state.adminTab || 'overview';
      const nav = [['overview','📊','Estatísticas'],['syllabus','📚','Banco de Editais'],['simulations','📝','Simulados Oficiais'],['rankings','🏆','Rankings'],['announcements','📢','Avisos']];
      const content = tab === 'syllabus' ? renderAdminSyllabusPanel() : tab === 'simulations' ? renderAdminSimulationsPanel() : tab === 'rankings' ? renderAdminRankingsPanel() : tab === 'announcements' ? renderAdminAnnouncementsPanel() : renderAdminOverviewPanel(totals);
      return `<div class="${embedded ? 'p-6 fade-in' : 'min-h-full bg-gray-50'}">${embedded ? '' : `<header class="bg-gradient-to-r from-navy-900 to-navy-800 text-white shadow-lg"><div class="max-w-7xl mx-auto px-6 py-6 flex items-center justify-between"><div class="flex items-center gap-4"><button onclick="goToProfileHome()" class="p-2 hover:bg-white/10 rounded-lg transition">←</button><div><h1 class="text-2xl font-black">Administração</h1><p class="text-navy-300 text-sm">Painel central do Aprova Policial</p></div></div><span class="px-3 py-1 rounded-full bg-accent-500 text-white text-xs font-bold">ADMIN</span></div></header>`}<main class="max-w-7xl mx-auto px-6 py-6"><div class="grid grid-cols-1 lg:grid-cols-[260px_1fr] gap-6"><aside class="bg-white rounded-2xl border border-gray-100 shadow-sm p-3 h-fit">${nav.map(([id,emoji,label]) => `<button onclick="openAdminPanel('${id}')" class="w-full text-left px-4 py-3 rounded-xl mb-1 font-bold ${tab===id?'bg-accent-50 text-accent-600':'text-navy-700 hover:bg-gray-50'}"><span class="mr-2">${emoji}</span>${label}</button>`).join('')}</aside><section>${content}</section></div></main></div><div id="modal-container"></div>`;
    }
    function renderAdminOverviewPanel(totals) { return `<div class="space-y-6"><div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6"><h2 class="text-2xl font-black text-navy-900 mb-1">Estatísticas da plataforma</h2><p class="text-gray-500">Visão administrativa dos alunos e uso geral.</p></div><div class="grid grid-cols-2 lg:grid-cols-4 gap-4">${adminStatCard('Alunos', totals.students, 'Usuários com dados no app')}${adminStatCard('Ativos 7 dias', totals.active7, 'Atualizaram recentemente')}${adminStatCard('Horas registradas', formatTime(totals.totalSeconds), 'Soma geral')}${adminStatCard('Questões', totals.totalQuestions, `${totals.accuracy}% acerto médio`)}</div><div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6"><h3 class="font-black text-navy-900 mb-4">Alunos recentes</h3>${renderAdminStudentsTable()}</div></div>`; }
    function renderAdminSyllabusPanel() {
      // No painel do administrador, o Banco de Editais usa a mesma estrutura completa
      // que aparece dentro do concurso: áreas, concursos-modelo, matérias e subtópicos.
      return (typeof renderModernSyllabusLibrary === 'function')
        ? renderModernSyllabusLibrary(null)

        case 'sessions': return renderSessions(contest);
        case 'questions': return renderQuestions(contest);
        case 'reviews': return renderReviews(contest);
        case 'simulations': return renderSimulations(contest);
        case 'files': return renderFiles(contest);
        case 'reports': return renderReports(contest);
        case 'studyCalendar': return renderStudyCalendar(contest);
        case 'achievements': return renderAchievements(contest);
        case 'backup': return renderBackup(contest);
        case 'admin': return isAdmin() ? renderAdminScreen(true) : renderDashboard(contest);
        default: return renderDashboard(contest);

    function renderDashboard(contest) {
      const syllabus = contest.syllabus || [];
      const sessions = contest.sessions || [];
      const questions = contest.questions || [];

      const progress = calculateProgress(syllabus);

        const sessionDate = new Date(s.date);

        weekAgo.setDate(weekAgo.getDate() - 7);

      const totalQuestions = questions.reduce((acc, q) => acc + (q.total || 0), 0);

      const accuracy = totalQuestions > 0 ? Math.round((correctQuestions / totalQuestions) * 100) : 0;
      
      const pendingReviews = reviews.filter(r => !r.completed && new Date(r.dueDate) <= new Date()).length;

      // Suggestions
      const suggestions = [];
      const lowPerformanceTopics = syllabus.filter(s => s.accuracy && s.accuracy < 60);
      const overdueReviews = reviews.filter(r => !r.completed && new Date(r.dueDate) < new Date());
      
      if (overdueReviews.length > 0) {

function getSyllabusTemplates() {
  state.adminData = ensureAdminDataShape(state.adminData);
  return state.adminData.syllabusTemplates || [];

function parseSyllabusNumberLabel(text) {
  const raw = (text || '').trim();
  const match = raw.match(/^(\d+(?:\.\d+)*)\s*[-.)]?\s*(.*)$/);
  if (!match) return { number: '', cleanName: raw, level: 1, parentNumber: null };
  const number = match[1];
  const cleanName = (match[2] || raw).trim();
  const parts = number.split('.');
  return {
    number,
    cleanName: cleanName || raw,
    level: Math.max(1, parts.length),
    parentNumber: parts.length > 1 ? parts.slice(0, -1).join('.') : null
  };
}

function makeTemplateItemFromText(text) {
  const parsed = parseSyllabusNumberLabel(text);
  return {
    id: generateId(),
    name: parsed.cleanName,
    originalText: text,
    number: parsed.number,
    level: parsed.level,
    parentNumber: parsed.parentNumber,
    priority: 'medium',
    status: 'pending',
    questions: 0,
    accuracy: 0,
    timeSpent: 0,
    nextReview: null
  };
}

function countTemplateSubtopics(template) {
  return (template.topics || []).reduce((acc, topic) => acc + ((topic.subtopics || []).length), 0);
}

function normalizeAreaName(area) {
  const value = (area || '').trim();
  return value || 'Geral';
}

function getTemplateArea(template) {
  return normalizeAreaName(template?.area || template?.careerArea || template?.category);
}

function getContestArea(contest) {
  return normalizeAreaName(contest?.area || contest?.careerArea || contest?.category);
}

function getSyllabusTemplateAreas() {
  const templates = getSyllabusTemplates();
  const areas = [...new Set(templates.map(t => getTemplateArea(t)))];
  return areas.sort((a, b) => a.localeCompare(b, 'pt-BR'));
}

function getDefaultContestAreas() {
  return ['Policial', 'Tribunal', 'Saúde', 'Educação', 'Fiscal', 'Administrativa', 'Outros'];
}

}

function renderSessions(contest) {

            <div class="flex items-center justify-between mb-6">

                <h3 class="font-semibold text-navy-900">Cronômetro</h3>
                <p class="text-sm text-gray-500 mt-1">Inicie, pause e finalize. Ao finalizar, você escolhe a disciplina, subtópico e tipo de estudo antes de salvar.</p>

                  <div role="button" tabindex="0" onclick="pauseTimer()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();pauseTimer();}" class="timer-btn-v226 timer-btn-pause-v226">
                    ${icons.pause}
                    <span>Pausar</span>
                  </div>

                ${state.timerSeconds === 0 ? `
                  <div class="timer-btn-v226 timer-btn-disabled-v226" aria-disabled="true">
                    ${icons.stop}
                    <span>Finalizar</span>
                  </div>
                ` : `
                  <div role="button" tabindex="0" onclick="stopTimer()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();stopTimer();}" class="timer-btn-v226 timer-btn-finish-v226">
                    ${icons.stop}
                    <span>Finalizar</span>
                  </div>
                `}

            </div>

          <!-- Manual Session Card -->
          <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-6">

              <div>
                <h3 class="font-semibold text-navy-900">Adicionar sessão manual</h3>

              </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-4">
              <select id="manual-session-topic" onchange="updateManualSessionSubtopicOptions()" class="px-3 py-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-accent-500 focus:border-accent-500 outline-none">
                <option value="">Selecione o tópico...</option>
                ${syllabus.map(t => `<option value="${t.id}">${t.name}</option>`).join('')}
              </select>
              <select id="manual-session-subtopic" class="px-3 py-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-accent-500 focus:border-accent-500 outline-none">
                <option value="">Subtópico (opcional)</option>
              </select>
              <select id="manual-session-type" class="px-3 py-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-accent-500 focus:border-accent-500 outline-none">
                <option value="theory">Teoria</option>
                <option value="questions">Questões</option>
                <option value="review">Revisão</option>
                <option value="video">Videoaula</option>
              </select>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-4 gap-4 items-end">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Horas</label>
                <input id="manual-session-hours" type="number" min="0" value="0" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-accent-500 focus:border-accent-500 outline-none">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Minutos</label>
                <input id="manual-session-minutes" type="number" min="0" max="59" value="0" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-accent-500 focus:border-accent-500 outline-none">
              </div>
              <div>

            </div>
            ${sessions.length === 0 ? `
              <div class="p-12 text-center text-gray-500">
                <p>Nenhuma sessão registrada ainda.</p>
              </div>
            ` : `
              <div class="divide-y divide-gray-100">
                ${sessions.slice(0, 10).map(session => `
                  <div class="px-5 py-4 flex items-center justify-between">
                    <div class="flex items-center gap-4">
                      <div class="w-10 h-10 bg-accent-100 rounded-lg flex items-center justify-center text-accent-600">
                        ${icons.clock}
                      </div>

                        <p class="font-medium text-navy-900">${session.topicName || 'Sem tópico'}${session.subtopicName ? ` • ${session.subtopicName}` : ''}</p>

                      </div>
                    </div>
                    <div class="text-right">
                      <p class="font-medium text-navy-900">${formatTime(session.duration || 0)}</p>

            `}

    function renderQuestions(contest) {
      const questions = contest.questions || [];
      const syllabus = contest.syllabus || [];
      
      const totalQuestions = questions.reduce((acc, q) => acc + (q.total || 0), 0);
      const correctQuestions = questions.reduce((acc, q) => acc + (q.correct || 0), 0);
      const errorQuestions = totalQuestions - correctQuestions;
      
      return `
        <div class="p-6 fade-in">
          <div class="flex items-center justify-between mb-6">
            <div>
              <h1 class="text-2xl font-bold text-navy-900">Questões & Erros</h1>
              <p class="text-gray-500">Registre e analise seu desempenho em questões</p>
            </div>
            <button onclick="showAddQuestionsModal()" class="inline-flex items-center gap-2 px-4 py-2 bg-accent-600 text-white rounded-lg hover:bg-accent-700 transition text-sm font-medium">
              ${icons.plus}
              <span>Registrar Questões</span>
            </button>
          </div>

          <!-- Stats -->
          <div class="grid grid-cols-3 gap-4 mb-6">
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 text-center">
              <p class="text-3xl font-bold text-navy-900">${totalQuestions}</p>
              <p class="text-sm text-gray-500">Total de Questões</p>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 text-center">
              <p class="text-3xl font-bold text-green-600">${correctQuestions}</p>
              <p class="text-sm text-gray-500">Acertos</p>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 text-center">
              <p class="text-3xl font-bold text-red-600">${errorQuestions}</p>
              <p class="text-sm text-gray-500">Erros</p>
            </div>
          </div>

          <!-- Questions List -->
          <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="px-5 py-4 border-b border-gray-100">
              <h3 class="font-semibold text-navy-900">Blocos de Questões</h3>
            </div>
            ${questions.length === 0 ? `
              <div class="p-12 text-center text-gray-500">
                <p>Nenhum bloco de questões registrado.</p>
              </div>
            ` : `
              <div class="divide-y divide-gray-100">
                ${questions.map(q => `
                  <div class="px-5 py-4 flex items-center justify-between">
                    <div class="flex items-center gap-4">
                      <div class="w-10 h-10 bg-accent-100 rounded-lg flex items-center justify-center text-accent-600">
                        ${icons.question}
                      </div>
                      <div>
                        <p class="font-medium text-navy-900">${q.subtopicName ? `${q.topicName} • ${q.subtopicName}` : (q.topicName || 'Geral')}</p>
                        <p class="text-sm text-gray-500">${q.source || 'Sem fonte'} • ${formatDate(q.date)}</p>
                      </div>
                    </div>
                    <div class="flex items-center gap-4">
                      <div class="text-right">
                        <p class="font-medium text-navy-900">${q.correct}/${q.total}</p>
                        <p class="text-sm ${(q.correct / q.total * 100) >= 70 ? 'text-green-600' : 'text-red-600'}">${Math.round(q.correct / q.total * 100)}%</p>
                      </div>
                      <button onclick="deleteQuestionBlock('${q.id}')" class="p-2 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition">
                        ${icons.trash}
                      </button>
                    </div>
                  </div>
                `).join('')}
              </div>
            `}
          </div>
        </div>
      `;
    }

    function renderReviews(contest) {
      const reviews = contest.reviews || [];
      const settings = contest.reviewSettings || { intervals: [1, 7, 30] };
      
      const pending = reviews.filter(r => !r.completed);
      const overdue = pending.filter(r => new Date(r.dueDate) < new Date());
      const today = pending.filter(r => {
        const due = new Date(r.dueDate);
        const now = new Date();
        return due.toDateString() === now.toDateString();
      });
      
      return `
        <div class="p-6 fade-in">
          <div class="flex items-center justify-between mb-6">
            <div>
              <h1 class="text-2xl font-bold text-navy-900">Revisões</h1>
              <p class="text-gray-500">Gerencie suas revisões espaçadas</p>
            </div>
            <button onclick="showReviewSettingsModal()" class="inline-flex items-center gap-2 px-4 py-2 bg-white text-navy-700 rounded-lg hover:bg-gray-50 transition text-sm font-medium border border-gray-200">
              ${icons.edit}
              <span>Configurar Intervalos</span>
            </button>
          </div>

          <!-- Review Stats -->
          <div class="grid grid-cols-3 gap-4 mb-6">
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 text-center">
              <p class="text-3xl font-bold text-red-600">${overdue.length}</p>
              <p class="text-sm text-gray-500">Atrasadas</p>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 text-center">
              <p class="text-3xl font-bold text-amber-600">${today.length}</p>
              <p class="text-sm text-gray-500">Para Hoje</p>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 text-center">
              <p class="text-3xl font-bold text-navy-900">${pending.length}</p>
              <p class="text-sm text-gray-500">Total Pendentes</p>
            </div>
          </div>

          <!-- Intervals Config Display -->
          <div class="bg-navy-50 rounded-xl p-4 mb-6 border border-navy-100">
            <p class="text-sm text-navy-700">
              <strong>Intervalos configurados:</strong> ${settings.intervals.join(' → ')} dias
            </p>
          </div>

          <!-- Pending Reviews -->
          <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="px-5 py-4 border-b border-gray-100">
              <h3 class="font-semibold text-navy-900">Agenda de Revisões</h3>
            </div>
            ${pending.length === 0 ? `
              <div class="p-12 text-center text-gray-500">
                <p>Nenhuma revisão pendente.</p>
              </div>
            ` : `
              <div class="divide-y divide-gray-100">
                ${pending.sort((a, b) => new Date(a.dueDate) - new Date(b.dueDate)).map(review => {
                  const isOverdue = new Date(review.dueDate) < new Date();
                  const isToday = new Date(review.dueDate).toDateString() === new Date().toDateString();
                  return `
                    <div class="px-5 py-4 flex items-center justify-between ${isOverdue ? 'bg-red-50' : isToday ? 'bg-amber-50' : ''}">
                      <div class="flex items-center gap-4">
                        <div class="w-10 h-10 ${isOverdue ? 'bg-red-100 text-red-600' : 'bg-accent-100 text-accent-600'} rounded-lg flex items-center justify-center">
                          ${icons.refresh}
                        </div>
                        <div>
                          <p class="font-medium text-navy-900">${review.topicName || 'Tópico'}</p>
                          <p class="text-sm ${isOverdue ? 'text-red-600' : 'text-gray-500'}">
                            ${isOverdue ? 'Atrasada desde ' : ''}${formatDate(review.dueDate)}
                          </p>
                        </div>
                      </div>
                      <div class="flex items-center gap-2">
                        <button onclick="completeReview('${review.id}')" class="inline-flex items-center gap-1 px-3 py-1.5 bg-green-600 text-white rounded-lg hover:bg-green-700 transition text-sm">
                          ${icons.check}
                          <span>Concluir</span>
                        </button>
                        <button onclick="postponeReview('${review.id}')" class="inline-flex items-center gap-1 px-3 py-1.5 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition text-sm">
                          <span>Adiar</span>
                        </button>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            `}
          </div>
        </div>
      `;
    }

    function getOfficialSimulationResults(simId) {
      return (state.officialSimulationResults || []).filter(r => r.simulation_id === simId).sort((a,b) => (b.score || 0) - (a.score || 0));
    }
    function renderOfficialRanking(simId, limit = 10) {
      const results = getOfficialSimulationResults(simId).slice(0, limit);
      if (!results.length) return '<p class="text-sm text-gray-500">Ainda não há participantes neste ranking.</p>';
      return `<div class="space-y-2">${results.map((r,idx)=>`<div class="flex items-center justify-between rounded-xl border border-gray-100 bg-gray-50 px-4 py-3"><div class="flex items-center gap-3"><span class="w-8 h-8 rounded-full ${idx<3?'bg-amber-100 text-amber-700':'bg-white text-gray-600'} flex items-center justify-center font-black">${idx+1}</span><div><p class="font-bold text-navy-900">${escapeHtml(r.user_name || r.user_email || 'Aluno')}</p><p class="text-xs text-gray-500">${r.created_at ? formatDate(r.created_at) : ''}</p></div></div><div class="text-right"><p class="font-black ${r.score>=70?'text-green-600':r.score>=50?'text-amber-600':'text-red-600'}">${r.score || 0}%</p><p class="text-xs text-gray-500">${r.correct || 0}/${r.total || 0}</p></div></div>`).join('')}</div>`;
    }
    function renderSimulations(contest) {
      const simulations = contest.simulations || [];
      const official = (state.adminData?.officialSimulations || []).filter(s => s.published);
      return `
        <div class="p-6 fade-in">
          <div class="flex items-center justify-between mb-6"><div><h1 class="text-2xl font-bold text-navy-900">Simulados</h1><p class="text-gray-500">Responda simulados oficiais, veja rankings e registre simulados externos.</p></div><button onclick="showAddSimulationModal()" class="inline-flex items-center gap-2 px-4 py-2 bg-accent-600 text-white rounded-lg hover:bg-accent-700 transition text-sm font-medium">${icons.plus}<span>Novo Simulado Externo</span></button></div>
          <div class="mb-8"><h2 class="text-lg font-black text-navy-900 mb-3">Simulados Oficiais Aprova</h2>${official.length === 0 ? `<div class="bg-white rounded-xl shadow-sm border border-gray-100 p-8 text-center text-gray-500">Nenhum simulado oficial publicado ainda.</div>` : `<div class="grid grid-cols-1 lg:grid-cols-2 gap-4">${official.map(sim=>`<div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5"><div class="flex items-start justify-between gap-3 mb-4"><div><h3 class="font-black text-navy-900">${escapeHtml(sim.name)}</h3><p class="text-sm text-gray-500">${escapeHtml(sim.contest || 'Geral')} • ${sim.total || 0} questões</p></div><span class="text-xs px-2 py-1 rounded-full bg-green-100 text-green-700 font-bold">Oficial</span></div><div class="flex gap-2 mb-4"><button onclick="showTakeOfficialSimulationModal('${sim.id}')" class="px-4 py-2 bg-accent-600 text-white rounded-xl font-bold text-sm">Responder / Registrar nota</button></div><h4 class="text-sm font-black text-navy-900 mb-2">Ranking</h4>${renderOfficialRanking(sim.id, 5)}</div>`).join('')}</div>`}</div>
          <div><h2 class="text-lg font-black text-navy-900 mb-3">Simulados Externos / Registro Manual</h2>${simulations.length === 0 ? `<div class="bg-white rounded-xl shadow-sm border border-gray-100 p-12 text-center"><div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">${icons.award}</div><h4 class="text-lg font-medium text-navy-900 mb-2">Nenhum simulado externo registrado</h4><p class="text-gray-500 mb-4">Registre simulados de fora da plataforma para acompanhar sua evolução.</p></div>` : `<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">${simulations.slice(0, 6).map(sim => `<div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5"><div class="flex items-start justify-between mb-3"><div><h4 class="font-semibold text-navy-900">${escapeHtml(sim.name)}</h4><p class="text-sm text-gray-500">${formatDate(sim.date)}</p></div><div class="text-right"><p class="text-2xl font-bold ${sim.score >= 70 ? 'text-green-600' : sim.score >= 50 ? 'text-amber-600' : 'text-red-600'}">${sim.score}%</p><p class="text-sm text-gray-500">${sim.correct}/${sim.total}</p></div></div><div class="h-2 bg-gray-100 rounded-full"><div class="h-full rounded-full ${sim.score >= 70 ? 'bg-green-500' : sim.score >= 50 ? 'bg-amber-500' : 'bg-red-500'}" style="width: ${sim.score}%"></div></div></div>`).join('')}</div>`}</div>
        </div>`;
    }

    function renderFiles(contest) {
      const files = contest.files || [];
      const syllabus = contest.syllabus || [];
      const grouped = files.reduce((acc, file) => {
        const key = file.discipline || 'Geral';
        if (!acc[key]) acc[key] = [];
        acc[key].push(file);
        return acc;
      }, {});
      const disciplineOrder = [
        ...syllabus.map(t => t.name).filter(Boolean),
        ...Object.keys(grouped).filter(name => !syllabus.some(t => t.name === name) && name !== 'Geral'),
        ...(grouped.Geral ? ['Geral'] : [])
      ];

      return `
        <div class="p-6 fade-in">
          <div class="flex items-center justify-between mb-6">
            <div>
              <h1 class="text-2xl font-bold text-navy-900">Arquivos</h1>
              <p class="text-gray-500">Organize materiais, links e observações por disciplina, sem ocupar armazenamento do Supabase.</p>
            </div>
            <button onclick="showAddFileModal()" class="inline-flex items-center gap-2 px-4 py-2 bg-accent-600 text-white rounded-lg hover:bg-accent-700 transition text-sm font-medium">
              ${icons.plus}
              <span>Adicionar Material</span>
            </button>
          </div>

          ${files.length === 0 ? `
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-12 text-center">
              <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
                ${icons.folder}
              </div>
              <h4 class="text-lg font-medium text-navy-900 mb-2">Nenhum material cadastrado</h4>
              <p class="text-gray-500 mb-4">Adicione links externos, nomes de PDFs/apostilas e observações e mantenha tudo separado por disciplina.</p>
            </div>
          ` : `
            <div class="space-y-6">
              ${disciplineOrder.filter(name => grouped[name]?.length).map(discipline => `
                <section class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                  <div class="flex items-center justify-between gap-3 px-5 py-4 border-b border-gray-100 bg-gray-50">
                    <div>
                      <h3 class="font-black text-navy-900">${escapeHtml(discipline)}</h3>
                      <p class="text-xs text-gray-500">${grouped[discipline].length} material(is) registrado(s)</p>
                    </div>
                    <span class="text-xs font-bold text-accent-600 bg-accent-50 px-3 py-1 rounded-full">Disciplina</span>
                  </div>
                  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 p-5">
                    ${grouped[discipline].map(file => {
                      const openUrl = file.fileUrl || file.url || '';
                      const typeLabel = file.type || (file.fileName ? 'Arquivo' : 'Material');
                      return `
                        <div class="bg-white rounded-xl border border-gray-100 p-4 card-hover">
                          <div class="flex items-start gap-3">

                              </div>
                              ${file.notes ? `<p class="text-sm text-gray-600 mt-3">${escapeHtml(file.notes)}</p>` : ''}
                              <div class="flex flex-wrap gap-2 mt-4">

                                ${file.url && file.fileUrl ? `<a href="${safeLinkUrl(file.url)}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center px-3 py-2 text-xs font-bold rounded-lg bg-gray-100 text-gray-700 hover:bg-gray-200">Abrir link</a>` : ''}
