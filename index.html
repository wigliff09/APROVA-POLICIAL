                        </div>
                      `;
                    }).join('')}
                  </div>
                </section>
              `).join('')}
            </div>
          `}
        </div>
      `;
    }


    


function getDisciplineLabel(topic, fallback = 'Geral') {
  if (!topic) return fallback || 'Geral';
  // Nos relatórios gerais, a disciplina é o tópico principal do edital.
  // O campo parent costuma ser a área maior (ex.: Conhecimentos Gerais), por isso não deve agrupar o gráfico.
  return topic.name || fallback || 'Geral';
}

function renderReports(contest) {
  const sessions = contest.sessions || [];
  const questions = contest.questions || [];
  const syllabus = contest.syllabus || [];
  const view = getReportViewState(contest);
  const range = getReportRange(contest);
  const mode = getActiveContestMode(contest);

  const periodSessions = sessions.filter(s => (s.planMode || 'pre') === mode && isDateInRange(s.date, range.start, range.end));
  const periodQuestions = questions.filter(q => (q.planMode || 'pre') === mode && isDateInRange(q.date, range.start, range.end));

  const hoursByDiscipline = {};
  periodSessions.forEach(s => {
    const topic = syllabus.find(t => t.id === s.topicId);
    const discipline = getDisciplineLabel(topic, s.topicName || 'Outros');
    hoursByDiscipline[discipline] = (hoursByDiscipline[discipline] || 0) + (s.duration || 0);
  });

  const accuracyByDiscipline = {};
  periodQuestions.forEach(q => {
    const topic = syllabus.find(t => t.id === q.topicId);
    const discipline = getDisciplineLabel(topic, q.topicName || 'Geral');
    if (!accuracyByDiscipline[discipline]) accuracyByDiscipline[discipline] = { correct: 0, total: 0 };
    accuracyByDiscipline[discipline].correct += q.correct || 0;
    accuracyByDiscipline[discipline].total += q.total || 0;
  });

  const periodSeconds = periodSessions.reduce((acc, s) => acc + (s.duration || 0), 0);
  const periodQuestionsTotal = periodQuestions.reduce((acc, q) => acc + (q.total || 0), 0);
  const periodQuestionsCorrect = periodQuestions.reduce((acc, q) => acc + (q.correct || 0), 0);
  const periodAccuracy = periodQuestionsTotal > 0 ? Math.round((periodQuestionsCorrect / periodQuestionsTotal) * 100) : 0;

  const timePieData = Object.entries(hoursByDiscipline)
    .sort((a,b) => b[1] - a[1])
    .slice(0, 8)
    .map(([label, value]) => ({ label, value, display: formatTime(value) }));

  const questionPieData = Object.entries(accuracyByDiscipline)
    .filter(([, data]) => data.total > 0)
    .sort((a,b) => b[1].total - a[1].total)
    .slice(0, 8)
    .map(([label, data]) => ({ label, value: data.total, display: `${data.total} q • ${Math.round((data.correct / data.total) * 100)}%` }));

  const ranking = Object.entries(accuracyByDiscipline)
    .filter(([, data]) => data.total > 0)
    .map(([label, data]) => {
      const accuracy = Math.round((data.correct / data.total) * 100);
      const volumeFactor = Math.min(data.total / 10, 20);
      return { label, accuracy, total: data.total, score: Number((accuracy + volumeFactor).toFixed(1)) };
    })
    .sort((a,b) => b.score - a.score);

  const periodTopicIds = new Set([
    ...periodSessions.map(s => s.topicId).filter(Boolean),
    ...periodQuestions.map(q => q.topicId).filter(Boolean)
  ]);
  const criticalTopics = syllabus
    .filter(t => periodTopicIds.has(t.id) || (t.questions || 0) > 0 || (t.accuracy || 0) > 0)
    .filter(t => (t.accuracy || 0) < 60)
    .sort((a,b) => (a.accuracy || 0) - (b.accuracy || 0))
    .slice(0, 5);

  const maxHours = Math.max(...Object.values(hoursByDiscipline), 1);
  const periodLabel = view.periodType === 'month' ? 'no mês' : view.periodType === 'custom' ? 'no período' : 'na semana';
  const previousLabel = view.periodType === 'month' ? '← Mês' : view.periodType === 'custom' ? '← Período' : '← Semana';
  const nextLabel = view.periodType === 'month' ? 'Mês →' : view.periodType === 'custom' ? 'Período →' : 'Semana →';

  const calendarBase = new Date(range.calendarDate);
  const calendarStart = new Date(calendarBase.getFullYear(), calendarBase.getMonth(), 1);
  const calendarEnd = new Date(calendarBase.getFullYear(), calendarBase.getMonth() + 1, 0);
  const firstWeekday = calendarStart.getDay();
  const daysInMonth = calendarEnd.getDate();
  const todayIso = toISODateOnly(new Date());
  const activityByDay = {};
  const allModeSessions = sessions.filter(s => (s.planMode || 'pre') === mode);
  const allModeQuestions = questions.filter(q => (q.planMode || 'pre') === mode);
  allModeSessions.forEach(s => {
    const iso = toISODateOnly(s.date);
    if (!activityByDay[iso]) activityByDay[iso] = { sessions: 0, seconds: 0, questions: 0, correct: 0 };
    activityByDay[iso].sessions += 1;
    activityByDay[iso].seconds += s.duration || 0;
  });
  allModeQuestions.forEach(q => {
    const iso = toISODateOnly(q.date);
    if (!activityByDay[iso]) activityByDay[iso] = { sessions: 0, seconds: 0, questions: 0, correct: 0 };
    activityByDay[iso].questions += q.total || 0;
    activityByDay[iso].correct += q.correct || 0;
  });
  const calendarCells = [];
  for (let i = 0; i < firstWeekday; i++) calendarCells.push(`<div class="min-h-[112px] bg-gray-50/60 border border-gray-100 rounded-lg"></div>`);
  for (let day = 1; day <= daysInMonth; day++) {
    const d = new Date(calendarStart.getFullYear(), calendarStart.getMonth(), day);
    const iso = toISODateOnly(d);
    const activity = activityByDay[iso];
    const inRange = d >= range.start && d < range.end;
    const hasActivity = activity && (activity.sessions > 0 || activity.questions > 0 || activity.seconds > 0);
    calendarCells.push(`
      <button onclick="${hasActivity ? `showReportDayDetails('${iso}')` : ''}" class="min-h-[112px] text-left border rounded-lg p-3 transition ${inRange ? 'border-accent-200 bg-accent-50/40' : 'border-gray-100 bg-white'} ${hasActivity ? 'hover:shadow-md hover:border-accent-400 cursor-pointer' : 'cursor-default'} ${iso === todayIso ? 'ring-2 ring-accent-400' : ''}">
        <div class="flex items-center justify-between mb-2">
          <span class="text-sm font-semibold ${iso === todayIso ? 'text-accent-600' : 'text-gray-600'}">${day}</span>
          ${hasActivity ? '<span class="w-3 h-3 rounded-full bg-green-500"></span>' : ''}
        </div>
        ${hasActivity ? `
          <div class="mt-4 space-y-1 text-xs text-navy-700">
            <div class="flex items-center gap-1">${icons.book}<span>${activity.sessions} ativ.</span></div>
            <div class="flex items-center gap-1">${icons.clock}<span>${formatTime(activity.seconds)}</span></div>
            ${activity.questions > 0 ? `<div class="flex items-center gap-1">${icons.question}<span>${activity.questions} quest.</span></div>` : ''}
          </div>
        ` : ''}
      </button>
    `);
  }

  return `
    <div class="p-6 fade-in">
      <div class="mb-6 flex flex-col xl:flex-row xl:items-center xl:justify-between gap-4">
        <div>
          <h1 class="text-2xl font-bold text-navy-900">Relatórios</h1>
          <p class="text-gray-500">Análise detalhada do seu desempenho</p>
        </div>
        <div class="flex flex-wrap gap-2">
          <button onclick="setActiveContestMode('pre')" class="px-4 py-2 rounded-lg text-sm font-medium border ${mode === 'pre' ? 'bg-accent-600 text-white border-accent-600' : 'bg-white text-navy-700 border-gray-200 hover:bg-gray-50'}">Pré-edital</button>
          <button onclick="setActiveContestMode('post')" class="px-4 py-2 rounded-lg text-sm font-medium border ${mode === 'post' ? 'bg-accent-600 text-white border-accent-600' : 'bg-white text-navy-700 border-gray-200 hover:bg-gray-50'}">Pós-edital</button>
          <button onclick="setReportPeriodType('week')" class="px-4 py-2 rounded-lg text-sm font-medium border ${view.periodType === 'week' ? 'bg-navy-900 text-white border-navy-900' : 'bg-white text-navy-700 border-gray-200 hover:bg-gray-50'}">Semana</button>
          <button onclick="setReportPeriodType('month')" class="px-4 py-2 rounded-lg text-sm font-medium border ${view.periodType === 'month' ? 'bg-navy-900 text-white border-navy-900' : 'bg-white text-navy-700 border-gray-200 hover:bg-gray-50'}">Mês</button>
          <button onclick="setReportPeriodType('custom')" class="px-4 py-2 rounded-lg text-sm font-medium border ${view.periodType === 'custom' ? 'bg-navy-900 text-white border-navy-900' : 'bg-white text-navy-700 border-gray-200 hover:bg-gray-50'}">Período manual</button>
        </div>
      </div>

      <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 mb-6">
        <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
          <div>
            <p class="text-sm text-gray-500">Período selecionado</p>
            <h2 class="text-xl font-bold text-navy-900">${range.label}</h2>
            <p class="text-xs text-gray-400 mt-1">Use semana, mês ou intervalo manual para analisar os dados.</p>
          </div>
          <div class="flex flex-wrap items-center gap-2">
            <button onclick="changeReportPeriod(-1)" class="px-4 py-2 rounded-lg text-sm font-medium bg-white text-navy-700 border border-gray-200 hover:bg-gray-50">${previousLabel}</button>
            <button onclick="resetReportPeriod()" class="px-4 py-2 rounded-lg text-sm font-medium bg-white text-navy-700 border border-gray-200 hover:bg-gray-50">Hoje</button>
            <button onclick="changeReportPeriod(1)" class="px-4 py-2 rounded-lg text-sm font-medium bg-white text-navy-700 border border-gray-200 hover:bg-gray-50">${nextLabel}</button>
          </div>
        </div>
        ${view.periodType === 'custom' ? `
          <div class="grid grid-cols-1 md:grid-cols-[1fr,1fr,auto] gap-3 mt-4 pt-4 border-t border-gray-100">
            <div>
              <label class="block text-xs font-medium text-gray-500 mb-1">Data inicial</label>
              <input id="report-custom-start" type="date" value="${view.customStart}" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-accent-500 focus:border-accent-500 outline-none">
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-500 mb-1">Data final</label>
              <input id="report-custom-end" type="date" value="${view.customEnd}" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-accent-500 focus:border-accent-500 outline-none">
            </div>
            <div class="flex items-end">
              <button onclick="applyReportCustomRange()" class="w-full md:w-auto px-5 py-2 bg-accent-600 text-white rounded-lg hover:bg-accent-700 transition font-medium">Aplicar</button>
            </div>
          </div>
        ` : ''}
      </div>

      <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 mb-6">
        <div class="flex items-center justify-between mb-4">
          <div>
            <h3 class="font-semibold text-navy-900">Calendário mensal de atividades</h3>
            <p class="text-sm text-gray-500">Clique em um dia com marca verde para ver o que foi estudado.</p>
          </div>
          <h3 class="font-bold text-navy-900">${formatMonthYear(calendarStart)}</h3>
        </div>
        <div class="grid grid-cols-7 gap-2 mb-2">
          ${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(d => `<div class="text-sm font-semibold text-gray-500 px-2">${d}</div>`).join('')}
        </div>
        <div class="grid grid-cols-7 gap-2">
          ${calendarCells.join('')}
        </div>
      </div>

      <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
          <p class="text-sm text-gray-500">Horas ${periodLabel}</p>
          <p class="text-2xl font-bold text-navy-900 mt-1">${formatTime(periodSeconds)}</p>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
          <p class="text-sm text-gray-500">Sessões ${periodLabel}</p>
          <p class="text-2xl font-bold text-navy-900 mt-1">${periodSessions.length}</p>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
          <p class="text-sm text-gray-500">Questões ${periodLabel}</p>
          <p class="text-2xl font-bold text-navy-900 mt-1">${periodQuestionsTotal}</p>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
          <p class="text-sm text-gray-500">Acerto médio</p>
          <p class="text-2xl font-bold ${periodAccuracy >= 70 ? 'text-green-600' : periodAccuracy >= 50 ? 'text-amber-600' : 'text-red-600'} mt-1">${periodAccuracy}%</p>
        </div>
      </div>

      <div class="grid grid-cols-1 xl:grid-cols-2 gap-6 mb-6">
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
          <h3 class="font-semibold text-navy-900 mb-4">Tempo por Disciplina</h3>
          ${renderPieChartSvg(timePieData, 'Tempo por disciplina', 'Sem sessões registradas neste período.')}
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
          <h3 class="font-semibold text-navy-900 mb-4">Questões por Matéria</h3>
          ${renderPieChartSvg(questionPieData, 'Questões por matéria', 'Sem questões registradas neste período.')}
        </div>
      </div>

      <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
          <h3 class="font-semibold text-navy-900 mb-4">Horas por Disciplina</h3>
          ${Object.keys(hoursByDiscipline).length === 0 ? `
            <p class="text-gray-500 text-center py-8">Sem sessões registradas neste período.</p>
          ` : `
            <div class="space-y-3">
              ${Object.entries(hoursByDiscipline).sort((a,b) => b[1] - a[1]).map(([name, value]) => `
                <div>
                  <div class="flex justify-between text-sm mb-1">
                    <span class="text-navy-700">${name}</span>
                    <span class="text-gray-500">${formatTime(value)}</span>
                  </div>
                  <div class="h-2 bg-gray-100 rounded-full">
                    <div class="h-full bg-accent-500 rounded-full" style="width:${Math.max(8, Math.round((value / maxHours) * 100))}%"></div>
                  </div>
                </div>
              `).join('')}
            </div>
          `}
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
          <h3 class="font-semibold text-navy-900 mb-4">% Acertos por Matéria</h3>
          ${Object.keys(accuracyByDiscipline).length === 0 ? `
            <p class="text-gray-500 text-center py-8">Registre questões para ver estatísticas deste período.</p>
          ` : `
            <div class="space-y-3">
              ${Object.entries(accuracyByDiscipline).map(([name, data]) => {
                const accuracy = data.total > 0 ? Math.round((data.correct / data.total) * 100) : 0;
                return `
                  <div>
                    <div class="flex justify-between text-sm mb-1">
                      <span class="text-navy-700">${name}</span>
                      <span class="${accuracy >= 70 ? 'text-green-600' : accuracy >= 50 ? 'text-amber-600' : 'text-red-600'}">${accuracy}%</span>
                    </div>
                    <div class="h-2 bg-gray-100 rounded-full">
                      <div class="h-full rounded-full ${accuracy >= 70 ? 'bg-green-500' : accuracy >= 50 ? 'bg-amber-500' : 'bg-red-500'}" style="width:${Math.max(8, accuracy)}%"></div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          `}
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
          <h3 class="font-semibold text-navy-900 mb-4">Ranking de Desempenho por Disciplina</h3>
          ${ranking.length === 0 ? `
            <p class="text-gray-500 text-center py-8">Registre questões para montar o ranking.</p>
          ` : `
            <div class="space-y-3">
              ${ranking.map((item, idx) => `
                <div class="${idx === 0 ? 'bg-amber-50 border-amber-200' : 'bg-gray-50 border-gray-100'} border rounded-lg p-3 flex items-center justify-between gap-3">
                  <div class="flex items-center gap-3 min-w-0">
                    <div class="w-10 h-10 rounded-full ${idx === 0 ? 'bg-amber-500 text-white' : idx === 1 ? 'bg-slate-400 text-white' : idx === 2 ? 'bg-orange-400 text-white' : 'bg-gray-200 text-gray-700'} flex items-center justify-center font-bold">${idx + 1}</div>
                    <div class="min-w-0">
                      <p class="font-medium text-navy-900 truncate">${item.label}</p>
                      <p class="text-sm text-gray-500">${item.total} questões</p>
                    </div>
                  </div>
                  <div class="text-right">
                    <p class="${item.accuracy >= 70 ? 'text-green-600' : item.accuracy >= 50 ? 'text-amber-600' : 'text-red-600'} font-semibold">${item.accuracy}%</p>
                    <p class="text-xs text-gray-400">score ${item.score}</p>
                  </div>
                </div>
              `).join('')}
            </div>
          `}
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
          <h3 class="font-semibold text-navy-900 mb-4">Tópicos Críticos</h3>
          ${criticalTopics.length === 0 ? `
            <p class="text-gray-500 text-center py-8">Nenhum tópico crítico identificado.</p>
          ` : `
            <div class="space-y-3">
              ${criticalTopics.map(topic => `
                <div class="bg-red-50 border border-red-100 rounded-lg p-3">
                  <div class="flex items-center justify-between gap-3">
                    <div>
                      <p class="font-medium text-navy-900">${topic.name}</p>
                      <p class="text-sm text-gray-500">${topic.questions || 0} questões</p>
                    </div>
                    <div class="text-red-600 font-semibold">${topic.accuracy || 0}%</div>
                  </div>
                </div>
              `).join('')}
            </div>
          `}
        </div>
      </div>
    </div>
  `;
}

async function createSyllabusTemplate(event) {
  event.preventDefault();
  if (!requireAdminAction('Apenas administradores podem criar editais oficiais.')) return;
  state.adminData = ensureAdminDataShape(state.adminData);
  const area = normalizeAreaName(document.getElementById('template-area')?.value || state.currentSyllabusArea || 'Geral');
  const template = {
    id: generateId(),
    area,
    name: document.getElementById('template-name').value.trim(),
    organization: document.getElementById('template-org').value.trim(),
    createdAt: new Date().toISOString(),
    topics: []
  };
  state.adminData.syllabusTemplates.unshift(template);
  await savePlatformData();
  state.profileSyllabusLibraryOpen = true;
  state.currentSyllabusTemplateId = template.id;
  savePlatformData();
  closeModal();
  render();
}

function deleteSyllabusTemplate(templateId) {
  if (!requireAdminAction('Apenas administradores podem excluir editais oficiais.')) return;
  showNiceConfirm('Excluir concurso-modelo?', 'Esse modelo será removido do Banco de Editais. Esta ação não pode ser desfeita.', 'Excluir', 'danger', async () => {
    state.adminData = ensureAdminDataShape(state.adminData);
    state.adminData.syllabusTemplates = (state.adminData.syllabusTemplates || []).filter(t => t.id !== templateId);
    if (state.currentSyllabusTemplateId === templateId) state.currentSyllabusTemplateId = null;
    await savePlatformData();
    render();
  });
}


function escapeAttrSafe(value) {
  return String(value || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function refreshSyllabusBuilderLabels() {
  const list = document.getElementById('template-subtopics-list');
  if (!list) return;
  const rows = Array.from(list.querySelectorAll('.template-subtopic-row'));
  let topicCount = 0;
  const childCounters = {};
  rows.forEach((row) => {
    const type = row.dataset.type || 'topic';
    const parent = row.dataset.parent || '';
    const badge = row.querySelector('.syllabus-builder-badge');
    const title = row.querySelector('.syllabus-builder-title');
    if (type === 'topic') {
      topicCount += 1;
      row.dataset.number = String(topicCount);
      childCounters[row.dataset.uid] = 0;
      if (badge) badge.textContent = topicCount;
      if (title) title.textContent = `Item ${topicCount}`;
    } else {
      childCounters[parent] = (childCounters[parent] || 0) + 1;
      const parentRow = rows.find(r => r.dataset.uid === parent);
      const parentNumber = parentRow?.dataset.number || '?';
      const number = `${parentNumber}.${childCounters[parent]}`;
      row.dataset.number = number;
      if (badge) badge.textContent = number;
      if (title) title.textContent = `Subtópico ${number}`;
    }
  });
}

function addTemplateSubtopicDraftRow(parentUid = null) {
  const list = document.getElementById('template-subtopics-list');
  if (!list) return;
  const uid = generateId();
  const isChild = !!parentUid;
  const row = document.createElement('div');
  row.className = `template-subtopic-row syllabus-builder-row ${isChild ? 'child' : ''}`;
  row.dataset.uid = uid;
  row.dataset.type = isChild ? 'subtopic' : 'topic';
  if (isChild) row.dataset.parent = parentUid;

  row.innerHTML = `
    <div class="syllabus-builder-head">
      <div class="syllabus-builder-label">
        <span class="syllabus-builder-badge">${isChild ? '1.1' : '1'}</span>
        <span class="syllabus-builder-title">${isChild ? 'Subtópico' : 'Item'}</span>
      </div>
      <div class="syllabus-builder-actions">
        ${!isChild ? `<button type="button" onclick="addTemplateSubtopicDraftRow('${uid}')" class="syllabus-builder-mini green">+ Subtópico</button>` : ''}
        <button type="button" onclick="removeTemplateSubtopicDraftRow(this)" class="syllabus-builder-mini red">Remover</button>
      </div>
    </div>
    <textarea class="template-subtopic-item syllabus-builder-input" rows="2" placeholder="${isChild ? 'Digite o subtópico deste item' : 'Digite o tópico principal do edital'}"></textarea>
  `;

  if (isChild) {
    const parentRow = list.querySelector(`[data-uid="${parentUid}"]`);
    let insertAfter = parentRow;
    let cursor = parentRow?.nextElementSibling;
    while (cursor && cursor.dataset.type === 'subtopic' && cursor.dataset.parent === parentUid) {
      insertAfter = cursor;
      cursor = cursor.nextElementSibling;
    }
    insertAfter ? insertAfter.after(row) : list.appendChild(row);
  } else {
    list.appendChild(row);
  }
  refreshSyllabusBuilderLabels();
}

function removeTemplateSubtopicDraftRow(button) {
  const row = button.closest('.template-subtopic-row');
  if (!row) return;
  const uid = row.dataset.uid;
  const list = document.getElementById('template-subtopics-list');
  if (row.dataset.type === 'topic' && list) {
    list.querySelectorAll(`[data-parent="${uid}"]`).forEach(child => child.remove());
  }
  row.remove();
  refreshSyllabusBuilderLabels();
}

function collectSyllabusBuilderItems() {
  return Array.from(document.querySelectorAll('.template-subtopic-row')).map(row => {
    const name = (row.querySelector('.template-subtopic-item')?.value || '').trim();
    if (!name) return null;
    const type = row.dataset.type || 'topic';
    const number = row.dataset.number || '';
    const parentUid = row.dataset.parent || null;
    let parentNumber = null;
    if (parentUid) {
      const parentRow = document.querySelector(`.template-subtopic-row[data-uid="${parentUid}"]`);
      parentNumber = parentRow?.dataset.number || null;
    }
    return {
      id: generateId(),
      name,
      originalText: number ? `${number} ${name}` : name,
      number,
      level: type === 'subtopic' ? 2 : 1,
      parentNumber,
      priority: 'medium',
      status: 'pending',
      questions: 0,
      accuracy: 0,
      timeSpent: 0,
      nextReview: null
    };
  }).filter(Boolean);
}

  if (!list || !row) return;

}

function addTemplateTopic(event, templateId) {
  event.preventDefault();
  if (!requireAdminAction('Apenas administradores podem alterar editais oficiais.')) return;
  const templates = getSyllabusTemplates();
  const template = templates.find(t => t.id === templateId);
  if (!template) return;

  const items = collectSyllabusBuilderItems();

  if (items.length === 0) {
    showNiceInfo('Itens do edital não informados', 'Adicione pelo menos um tópico do edital antes de salvar a disciplina.');
    return;
  }

  const topic = {
    id: generateId(),
    name: document.getElementById('template-topic-name').value.trim(),
    parent: document.getElementById('template-topic-parent').value.trim() || null,
    priority: document.getElementById('template-topic-priority').value,
    weight: parseInt(document.getElementById('template-topic-weight').value || '3', 10),
    subtopics: items
  };

  template.topics = template.topics || [];
  template.topics.push(topic);
  savePlatformData();
  closeModal();
  render();
}

function deleteTemplateTopic(templateId, topicId) {
  if (!requireAdminAction('Apenas administradores podem alterar editais oficiais.')) return;
  showNiceConfirm('Excluir matéria do modelo?', 'A matéria e todos os subtópicos dela serão removidos deste concurso-modelo.', 'Excluir matéria', 'danger', () => {
    const template = getSyllabusTemplates().find(t => t.id === templateId);
    if (!template) return;
    template.topics = (template.topics || []).filter(t => t.id !== topicId);
    savePlatformData();
    render();
  });
}

function toggleTemplateImportTopic(topicId) {
  const topicCheckbox = document.querySelector(`.template-import-topic[data-topic-id="${topicId}"]`);
  const subCheckboxes = Array.from(document.querySelectorAll(`.template-import-subtopic[data-topic-id="${topicId}"]`));
  subCheckboxes.forEach(cb => { cb.checked = !!topicCheckbox?.checked; });
}

function refreshTemplateImportTopicCheck(topicId) {
  const topicCheckbox = document.querySelector(`.template-import-topic[data-topic-id="${topicId}"]`);
  const subCheckboxes = Array.from(document.querySelectorAll(`.template-import-subtopic[data-topic-id="${topicId}"]`));
  if (!topicCheckbox || subCheckboxes.length === 0) return;
  const checkedCount = subCheckboxes.filter(cb => cb.checked).length;
  topicCheckbox.checked = checkedCount === subCheckboxes.length;
  topicCheckbox.indeterminate = checkedCount > 0 && checkedCount < subCheckboxes.length;
}

function toggleAllTemplateImportSelection(checked) {
  document.querySelectorAll('.template-import-topic, .template-import-subtopic').forEach(cb => {
    cb.checked = checked;
    cb.indeterminate = false;
  });
}

function getSelectedTemplateImportTopics(template) {
  const topicCheckboxes = Array.from(document.querySelectorAll('.template-import-topic'));
  const subCheckboxes = Array.from(document.querySelectorAll('.template-import-subtopic'));
  const anySelected = topicCheckboxes.some(cb => cb.checked) || subCheckboxes.some(cb => cb.checked);
  if (!anySelected) return template.topics || [];

  return (template.topics || []).map(topic => {
    const topicChecked = topicCheckboxes.some(cb => cb.dataset.topicId === topic.id && cb.checked);
    const checkedSubIds = subCheckboxes
      .filter(cb => cb.dataset.topicId === topic.id && cb.checked)
      .map(cb => cb.dataset.subtopicId);

    if (topicChecked) return { ...topic, subtopics: topic.subtopics || [] };
    if (checkedSubIds.length > 0) {
      return {
        ...topic,
        subtopics: (topic.subtopics || []).filter(st => checkedSubIds.includes(st.id))
      };
    }
    return null;
  }).filter(Boolean);
}

function importSyllabusTemplate(eventOrTemplateId, maybeTemplateId = null) {
  if (eventOrTemplateId && typeof eventOrTemplateId.preventDefault === 'function') eventOrTemplateId.preventDefault();
  const templateId = maybeTemplateId || eventOrTemplateId;
  const profile = getCurrentProfile();
  const targetContestId = document.getElementById('target-contest-id')?.value || state.currentContest;
  const contest = profile?.contests?.find(c => c.id === targetContestId);
  const template = getSyllabusTemplates().find(t => t.id === templateId);
  if (!contest || !template) return;
  contest.area = contest.area || getTemplateArea(template);

  const selectedTopics = getSelectedTemplateImportTopics(template);
  const fullImport = selectedTopics.length === (template.topics || []).length && selectedTopics.every(t => {
    const original = (template.topics || []).find(orig => orig.id === t.id);
    return (t.subtopics || []).length === (original?.subtopics || []).length;
  });
  const confirmMessage = fullImport
    ? `Importar todo o edital de "${template.name}" para o concurso "${contest.name}"?`
    : `Importar ${selectedTopics.length} matéria(s) selecionada(s) do edital "${template.name}" para o concurso "${contest.name}"?`;
  showNiceConfirm('Confirmar importação', confirmMessage, 'Importar', 'default', () => {

  contest.syllabus = contest.syllabus || [];
  selectedTopics.forEach(t => {
    const newTopicId = generateId();
    contest.syllabus.push({
      id: newTopicId,
      name: t.name,
      parent: t.parent || null,
      priority: t.priority || 'medium',
      weight: t.weight || 3,
      status: 'pending',
      questions: 0,
      accuracy: 0,
      timeSpent: 0,
      nextReview: null,
      subtopics: (t.subtopics || []).map(st => ({
        id: generateId(),
        name: st.name,
        priority: st.priority || 'medium',
        status: 'pending',
        questions: 0,
        accuracy: 0,
        timeSpent: 0,
        nextReview: null
      }))
    });
  });
  saveToStorage();
  showNiceSuccess('Importação concluída', fullImport ? 'Edital importado com sucesso para o concurso selecionado.' : 'Conteúdo selecionado importado com sucesso para o concurso selecionado.');
  render();
  });
}

    // Timer functions (drift-free; accurate even when switching tabs)
    function getTimerElapsedSeconds() {
      if (state.timerRunning && state.timerStartEpoch) {
        const live = Math.floor((Date.now() - state.timerStartEpoch) / 1000);
        return state.timerAccumulatedSeconds + Math.max(0, live);
      }
      return state.timerAccumulatedSeconds;
    }

    function updateTimerDisplay() {
      state.timerSeconds = getTimerElapsedSeconds();
      const display = document.getElementById('timer-display');
      if (display) display.textContent = formatTime(state.timerSeconds);
    }

    function startTimer() {
      if (state.timerRunning) return;
      state.timerRunning = true;
      state.timerStartEpoch = Date.now();
      // Use a short tick; elapsed time is computed from timestamps so it won't drift when the tab is inactive
      state.timerInterval = setInterval(updateTimerDisplay, 250);
      updateTimerDisplay();
      render();
    }

    function pauseTimer() {
      if (!state.timerRunning) return;
      state.timerAccumulatedSeconds = getTimerElapsedSeconds();
      state.timerRunning = false;
      state.timerStartEpoch = null;
      clearInterval(state.timerInterval);
      updateTimerDisplay();
      render();
    }

    function stopTimer() {
      const elapsed = getTimerElapsedSeconds();
      if (elapsed === 0) return;
      pauseTimer();
      showFinalizeTimerModal(elapsed);
    }

              <button type="button" onclick="cancelTimerFinalize()" class="flex-1 px-5 py-3 bg-gray-100 text-gray-700 rounded-xl font-bold hover:bg-gray-200 transition">Cancelar</button>
              <button class="flex-1 px-5 py-3 bg-accent-600 text-white rounded-xl font-bold hover:bg-accent-700 transition">Confirmar e salvar</button>

      `);

    function updateTimerFinalSubtopicOptions() {
      const contest = getCurrentContest();
      const topicId = document.getElementById('timer-final-topic')?.value;
      const topic = (contest?.syllabus || []).find(t => t.id === topicId);
      const el = document.getElementById('timer-final-subtopic');
      if (el) el.innerHTML = getSubtopicOptions(topic);
    }

    function cancelTimerFinalize() {
      state.timerSeconds = 0;
      state.timerAccumulatedSeconds = 0;
      state.timerStartEpoch = null;
      state.sessionPrefill = { topicId: null, subtopicId: null };
      closeModal();
      render();
    }

    function confirmTimerSession(event, elapsed) {
      event.preventDefault();
      const contest = getCurrentContest();
      if (!contest) return;
      const topicId = document.getElementById('timer-final-topic')?.value || null;
      const subtopicId = document.getElementById('timer-final-subtopic')?.value || null;
      const type = document.getElementById('timer-final-type')?.value || 'theory';
      const topic = (contest.syllabus || []).find(t => t.id === topicId);
      const subtopic = topic && subtopicId ? (topic.subtopics || []).find(st => st.id === subtopicId) : null;
      if (!topicId || !topic) {
        showNiceInfo('Sessão incompleta', 'Selecione a disciplina/tópico para salvar o tempo estudado.');
        return;
      }

      const session = {
        id: generateId(),
        topicId,
        topicName: topic.name || 'Sem tópico',
        subtopicId,
        subtopicName: subtopic?.name || null,
        type,
        duration: Number(elapsed) || 0,
        date: new Date().toISOString(),
        planMode: getActiveContestMode(contest)
      };

      contest.sessions = contest.sessions || [];
      contest.sessions.unshift(session);

      if (type === 'theory') {
        const intervals = contest.reviewSettings?.intervals || [1, 7, 30];
        const reviewDate = new Date();
        reviewDate.setDate(reviewDate.getDate() + intervals[0]);
        createManualReview(contest, topicId, subtopic ? subtopic.id : null, reviewDate.toISOString());
      }

      recalcStudyTime(contest);
      state.timerSeconds = 0;
      state.timerAccumulatedSeconds = 0;
      state.timerStartEpoch = null;
      state.sessionPrefill = { topicId: null, subtopicId: null };
      saveToStorage();
      closeModal();
      render();
    }

    // Keep timer display accurate when switching tabs/windows
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        updateTimerDisplay();
      }
    });

    function normalizeImportedSyllabusTemplates(rawTemplates, existingTemplates = []) {
      const existingIds = new Set((existingTemplates || []).map(t => t.id));
      const usedIds = new Set(existingIds);

      function ensureId(oldId) {
        if (!oldId || usedIds.has(oldId)) {
          const newId = generateId();
          usedIds.add(newId);
          return newId;
        }
        usedIds.add(oldId);
        return oldId;
      }

      return (rawTemplates || []).map(template => {
        const newTemplate = {
          ...template,
          id: ensureId(template.id),
          area: normalizeAreaName(template.area || template.careerArea || template.category),
          name: template.name || 'Concurso-modelo importado',
          organization: template.organization || '',
          importedAt: new Date().toISOString(),
          topics: (template.topics || []).map(topic => ({
            ...topic,
            id: ensureId(topic.id),
            name: topic.name || 'Matéria importada',
            parent: topic.parent || null,
            priority: topic.priority || 'medium',
            weight: topic.weight || 3,
            subtopics: (topic.subtopics || []).map(subtopic => ({
              ...subtopic,
              id: ensureId(subtopic.id),
              name: subtopic.name || 'Subtópico importado',
              priority: subtopic.priority || 'medium',
              status: subtopic.status || 'pending',
              questions: subtopic.questions || 0,
              accuracy: subtopic.accuracy || 0,
              timeSpent: subtopic.timeSpent || 0,
              nextReview: subtopic.nextReview || null
            }))
          }))
        };
        return newTemplate;
      });
    }

    function exportSyllabusTemplates() {
      if (!requireAdminAction('Apenas administradores podem exportar o Banco de Editais oficial.')) return;
      state.adminData = ensureAdminDataShape(state.adminData);
      const templates = state.adminData.syllabusTemplates || [];
      const data = {
        version: '1.0',
        type: 'syllabusTemplates',
        exportedAt: new Date().toISOString(),
        scope: 'official',
        templates
      };

      downloadJSON(data, `banco-editais-oficial-${new Date().toISOString().split('T')[0]}.json`);
    }

    function importSyllabusTemplates() {
      if (!requireAdminAction('Apenas administradores podem importar o Banco de Editais oficial.')) return;

      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json,application/json';
      input.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            const rawTemplates = Array.isArray(data)
              ? data
              : (data.templates || data.syllabusTemplates || data.bancoEditais || []);

            if (!Array.isArray(rawTemplates) || rawTemplates.length === 0) {
              throw new Error('Arquivo sem modelos de edital.');
            }

            state.adminData = ensureAdminDataShape(state.adminData);
            showNiceChoice('Importar Banco de Editais', 'Escolha como deseja aplicar os modelos importados.', [
              { label: 'Substituir banco atual', description: 'Remove os modelos oficiais atuais e usa apenas os do arquivo.', color: '#dc2626', icon: icons.refresh, onClick: async () => {
                state.adminData.syllabusTemplates = normalizeImportedSyllabusTemplates(rawTemplates, []);
                state.profileSyllabusLibraryOpen = true;
                state.currentSyllabusArea = null;
                state.currentSyllabusTemplateId = null;
                await savePlatformData();
                render();
                showNiceSuccess('Banco de Editais importado', `${rawTemplates.length} modelo(s) foram importados com sucesso.`);
              }},
              { label: 'Mesclar com banco atual', description: 'Mantém os modelos oficiais atuais e adiciona os modelos do arquivo.', color: '#16a34a', icon: icons.plus, onClick: async () => {
                const imported = normalizeImportedSyllabusTemplates(rawTemplates, state.adminData.syllabusTemplates);
                state.adminData.syllabusTemplates = [...imported, ...state.adminData.syllabusTemplates];
                state.profileSyllabusLibraryOpen = true;
                state.currentSyllabusArea = null;
                state.currentSyllabusTemplateId = null;
                await savePlatformData();
                render();
                showNiceSuccess('Banco de Editais importado', `${rawTemplates.length} modelo(s) foram importados com sucesso.`);
              }},
              { label: 'Cancelar', description: 'Não importar este arquivo agora.', color: '#64748b', icon: icons.x, onClick: () => {} }
            ]);
          } catch (error) {
            showModal(`
              <div class="p-6 text-center">
                <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4 text-red-600">
                  ${icons.x}
                </div>
                <h3 class="text-lg font-bold text-navy-900 mb-2">Erro ao Importar Banco</h3>
                <p class="text-gray-600 mb-4">O arquivo não contém um Banco de Editais válido.</p>
                <button onclick="closeModal()" class="px-6 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition font-medium">Fechar</button>
              </div>
            `);
          }
        };
        reader.readAsText(file);
      };
      input.click();
    }

    function downloadJSON(data, filename) {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function importData() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            
            if (data.profiles) {
              // Full backup
              state.profiles = data.profiles;
            } else if (data.type === 'profile' && data.profile) {
              // Single profile
              data.profile.id = generateId(); // Generate new ID to avoid conflicts
              state.profiles.push(data.profile);
            } else if (data.type === 'contest' && data.contest && state.currentProfile) {
              // Single contest
              const profile = state.profiles.find(p => p.id === state.currentProfile);
              if (profile) {
                data.contest.id = generateId();
                profile.contests = profile.contests || [];
                profile.contests.push(data.contest);
              }
            }
            
            saveToStorage();
            render();
            
            showModal(`
              <div class="p-6 text-center">
                <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4 text-green-600">
                  ${icons.check}
                </div>
                <h3 class="text-lg font-bold text-navy-900 mb-2">Importação Concluída!</h3>
                <p class="text-gray-600 mb-4">Os dados foram importados com sucesso.</p>
                <button onclick="closeModal()" class="px-6 py-2 bg-accent-600 text-white rounded-lg hover:bg-accent-700 transition font-medium">OK</button>
              </div>
            `);
          } catch (error) {
            showModal(`
              <div class="p-6 text-center">
                <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4 text-red-600">
                  ${icons.x}
                </div>
                <h3 class="text-lg font-bold text-navy-900 mb-2">Erro na Importação</h3>
                <p class="text-gray-600 mb-4">O arquivo não é um JSON válido ou está corrompido.</p>
                <button onclick="closeModal()" class="px-6 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition font-medium">Fechar</button>
              </div>
            `);
          }
        };
        reader.readAsText(file);
      };
      input.click();
    }

    function restoreFromTrash(id) {
      const profile = state.profiles.find(p => p.id === state.currentProfile);
      const contest = profile?.contests?.find(c => c.id === state.currentContest);
      if (!contest || !contest.trash) return;
      
      const itemIndex = contest.trash.findIndex(t => t.id === id);
      if (itemIndex === -1) return;
      
      const item = contest.trash.splice(itemIndex, 1)[0];
      delete item.deletedAt;
      contest.syllabus = contest.syllabus || [];
      contest.syllabus.push(item);
      
      saveToStorage();
      render();
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
    }

    function getTopicOptions(contest, selectedId = '') {
      return `<option value="">Selecione o tópico...</option>` + (contest.syllabus || []).map(t => `<option value="${t.id}" ${t.id === selectedId ? 'selected' : ''}>${escapeHtml(t.name)}</option>`).join('');
    }

    function getSubtopicOptions(topic, selectedId = '') {
      return `<option value="">Subtópico (opcional)</option>` + ((topic?.subtopics || []).map(st => `<option value="${st.id}" ${st.id === selectedId ? 'selected' : ''}>${escapeHtml(st.name)}</option>`).join(''));
    }

    function normalizeDurationInput(prefix) {
      const h = parseInt(document.getElementById(`${prefix}-hours`)?.value || '0', 10) || 0;
      const m = parseInt(document.getElementById(`${prefix}-minutes`)?.value || '0', 10) || 0;
      const sec = parseInt(document.getElementById(`${prefix}-seconds`)?.value || '0', 10) || 0;
      return Math.max(0, h * 3600 + m * 60 + sec);
    }

    function saveManualSession() {
      const profile = state.profiles.find(p => p.id === state.currentProfile);
      const contest = profile?.contests?.find(c => c.id === state.currentContest);
      if (!contest) return;
      const topicId = document.getElementById('manual-session-topic')?.value || null;
      const subtopicId = document.getElementById('manual-session-subtopic')?.value || null;
      const totalSeconds = normalizeDurationInput('manual-session');
      const dateValue = document.getElementById('manual-session-date')?.value;
      if (!topicId || totalSeconds <= 0) { showNiceInfo('Sessão incompleta', 'Selecione um tópico e informe um tempo maior que zero.'); return; }
      const topic = contest.syllabus?.find(t => t.id === topicId);
      const subtopic = topic && subtopicId ? (topic.subtopics || []).find(st => st.id === subtopicId) : null;
      const session = { id: generateId(), topicId, topicName: topic?.name || 'Sem tópico', subtopicId, subtopicName: subtopic?.name || null, type: document.getElementById('manual-session-type')?.value || 'theory', duration: totalSeconds, date: dateValue ? new Date(dateValue).toISOString() : new Date().toISOString(), planMode: getActiveContestMode(contest), manualEntry: true };
      contest.sessions = contest.sessions || [];
      contest.sessions.unshift(session);
      recalcStudyTime(contest);
      saveToStorage(); render();
    }

    function recalcStudyTime(contest) {
      (contest.syllabus || []).forEach(t => { t.timeSpent = 0; (t.subtopics || []).forEach(st => st.timeSpent = 0); });
      (contest.sessions || []).forEach(s => {
        const t = (contest.syllabus || []).find(x => x.id === s.topicId);
        if (!t) return;
        const min = Math.round((s.duration || 0) / 60);
        t.timeSpent = (t.timeSpent || 0) + min;
        t.lastStudied = s.date || t.lastStudied;
        if (s.subtopicId) {
          const st = (t.subtopics || []).find(x => x.id === s.subtopicId);
          if (st) { st.timeSpent = (st.timeSpent || 0) + min; st.lastStudied = s.date || st.lastStudied; }
        }
      });
    }

      showModal(`<div class="p-6 max-w-xl"><h3 class="text-lg font-bold text-navy-900 mb-4">Editar sessão</h3><form onsubmit="updateSession(event,'${sessionId}')" class="space-y-4">

        <input id="edit-session-date" type="datetime-local" value="${new Date(session.date || Date.now()).toISOString().slice(0,16)}" class="w-full px-4 py-2 border border-gray-200 rounded-lg">

    function updateEditSessionSubtopicOptions(){ const contest=getCurrentContest(); const topicId=document.getElementById('edit-session-topic')?.value; const topic=(contest?.syllabus||[]).find(t=>t.id===topicId); const el=document.getElementById('edit-session-subtopic'); if(el) el.innerHTML=getSubtopicOptions(topic); }
    function updateSession(event, sessionId){ event.preventDefault(); const contest=getCurrentContest(); const s=(contest?.sessions||[]).find(x=>x.id===sessionId); if(!contest||!s)return; const topicId=document.getElementById('edit-session-topic')?.value; const topic=(contest.syllabus||[]).find(t=>t.id===topicId); const subId=document.getElementById('edit-session-subtopic')?.value||null; const sub=topic&&subId?(topic.subtopics||[]).find(st=>st.id===subId):null; s.topicId=topicId; s.topicName=topic?.name||'Sem tópico'; s.subtopicId=subId; s.subtopicName=sub?.name||null; s.type=document.getElementById('edit-session-type')?.value||'theory'; s.duration=normalizeDurationInput('edit-session'); const dv=document.getElementById('edit-session-date')?.value; if(dv) s.date=new Date(dv).toISOString(); recalcStudyTime(contest); saveToStorage(); closeModal(); render(); }

      return `<div class="p-6 fade-in">

    function importSyllabusTemplate(eventOrTemplateId, maybeTemplateId = null) {
      if (eventOrTemplateId && typeof eventOrTemplateId.preventDefault === 'function') eventOrTemplateId.preventDefault();
      const templateId = maybeTemplateId || eventOrTemplateId;
      const profile = getCurrentProfile();
      const targetContestId = document.getElementById('target-contest-id')?.value || state.currentContest;
      const contest = profile?.contests?.find(c => c.id === targetContestId);
      const template = getSyllabusTemplates().find(t => t.id === templateId);
      if (!contest || !template) return;
      contest.area = contest.area || getTemplateArea(template);
      const selectedTopics = getSelectedTemplateImportTopics(template);
      if (!selectedTopics.length) { showNiceInfo('Nenhuma matéria selecionada', 'Marque ao menos uma matéria ou subtópico para importar.'); return; }
      window.__pendingSyllabusImport = { contestId: targetContestId, templateId, selectedTopics };
      if ((contest.syllabus || []).length > 0) { showImportConflictChoice(); return; }
      let action = 'append';
      if (action === 'replace') contest.syllabus = [];
      contest.syllabus = contest.syllabus || [];
      selectedTopics.forEach(t => {
        const existing = contest.syllabus.find(x => (x.name || '').toLowerCase().trim() === (t.name || '').toLowerCase().trim());
        if (action === 'merge' && existing) {
          existing.subtopics = existing.subtopics || [];
          (t.subtopics || []).forEach(st => {
            const existsSub = existing.subtopics.some(x => (x.name || '').toLowerCase().trim() === (st.name || '').toLowerCase().trim());
            if (!existsSub) existing.subtopics.push({ id: generateId(), name: st.name, priority: st.priority || 'medium', status: 'pending', questions: 0, accuracy: 0, timeSpent: 0, nextReview: null });
          });
          return;
        }
        contest.syllabus.push({ id: generateId(), name: t.name, parent: t.parent || null, priority: t.priority || 'medium', weight: t.weight || 3, status: 'pending', questions: 0, accuracy: 0, timeSpent: 0, nextReview: null, subtopics: (t.subtopics || []).map(st => ({ id: generateId(), name: st.name, priority: st.priority || 'medium', status: 'pending', questions: 0, accuracy: 0, timeSpent: 0, nextReview: null })) });
      });
      saveToStorage(); showNiceSuccess('Importação concluída', 'Edital importado/mesclado com sucesso.'); render();
    }

    function renderBackup(contest){

  // Importação do Banco de Editais com modal bonito no lugar do confirm nativo
  window.importSyllabusTemplates = function(){
    if (!requireAdminAction('Apenas administradores podem importar o Banco de Editais oficial.')) return;

    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json,application/json';
    input.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const data = JSON.parse(event.target.result);
          const rawTemplates = Array.isArray(data)
            ? data
            : (data.templates || data.syllabusTemplates || data.bancoEditais || []);

          if (!Array.isArray(rawTemplates) || rawTemplates.length === 0) {
            throw new Error('Arquivo sem modelos de edital.');
          }

          window.__pendingSyllabusBankImport = { rawTemplates };

          showModernChoice({
            title: 'Importar Banco de Editais',
            message: `${rawTemplates.length} modelo(s) encontrados. Escolha como deseja aplicar esse arquivo.`,
            icon: icons.upload,
            tip: 'Recomendação: exporte um backup antes de substituir o banco atual.',
            choices: [
              {
                title: 'Substituir banco atual',
                description: 'Remove o Banco de Editais atual e usa somente o arquivo importado.',
                color: '#dc2626',
                icon: icons.refresh,
                action: "finishSyllabusBankImport('replace')"
              },
              {
                title: 'Mesclar com banco atual',
                description: 'Mantém o banco atual e adiciona os modelos importados.',
                color: '#16a34a',
                icon: icons.plus,
                action: "finishSyllabusBankImport('merge')"
              },
              {
                title: 'Cancelar importação',
                description: 'Não altera o Banco de Editais.',
                color: '#64748b',
                icon: icons.x,
                action: "finishSyllabusBankImport('cancel')"
              }
            ]
          });
        } catch (error) {
          modernNotice('danger', 'Erro ao importar Banco de Editais', 'O arquivo selecionado não contém um Banco de Editais válido.');
        }
      };
      reader.readAsText(file);
    };
    input.click();
  };

  window.finishSyllabusBankImport = async function(mode){
    const pending = window.__pendingSyllabusBankImport;
    if (!pending || mode === 'cancel') { closeModal(); return; }
    if (!requireAdminAction('Apenas administradores podem importar o Banco de Editais oficial.')) return;
    state.adminData = ensureAdminDataShape(state.adminData);
    if (mode === 'replace') {
      state.adminData.syllabusTemplates = normalizeImportedSyllabusTemplates(pending.rawTemplates, []);
    } else {
      const imported = normalizeImportedSyllabusTemplates(pending.rawTemplates, state.adminData.syllabusTemplates);
      state.adminData.syllabusTemplates = [...imported, ...state.adminData.syllabusTemplates];
    }
    state.profileSyllabusLibraryOpen = true;
    state.currentSyllabusArea = null;
    state.currentSyllabusTemplateId = null;
    await savePlatformData();
    closeModal();
    render();
    setTimeout(()=>modernNotice('success', 'Banco de Editais importado', `${pending.rawTemplates.length} modelo(s) foram importados com sucesso.`), 50);
    window.__pendingSyllabusBankImport = null;
  };

})();

    /* ===== ADMIN PLUS V1 - Dashboard, Rankings, Biblioteca Oficial e Estatísticas dos Alunos ===== */
    function ensureAdminDataShape(data = {}) {
      const base = (data && typeof data === 'object') ? data : {};
      return {
        ...base,
        syllabusTemplates: Array.isArray(base.syllabusTemplates) ? base.syllabusTemplates : [],
        officialSimulations: Array.isArray(base.officialSimulations) ? base.officialSimulations : [],
        announcements: Array.isArray(base.announcements) ? base.announcements : []
      };
    }

    function adminRows() {
      return Array.isArray(state.adminStudents) ? state.adminStudents : [];
    }

    function adminProfilesFromRow(row) {
      return Array.isArray(row?.profiles) ? row.profiles : [];
    }

    function adminContestsFromRow(row) {
      return adminProfilesFromRow(row).flatMap(p => Array.isArray(p.contests) ? p.contests : []);
    }

    function adminSessionsFromContest(contest) {
      return Array.isArray(contest?.sessions) ? contest.sessions : [];
    }

    function adminQuestionsFromContest(contest) {
      return Array.isArray(contest?.questions) ? contest.questions : [];
    }

    function adminContestSeconds(contest) {
      return adminSessionsFromContest(contest).reduce((a, s) => a + (Number(s.duration) || Number(s.seconds) || 0), 0);
    }

    function adminContestQuestions(contest) {
      return adminQuestionsFromContest(contest).reduce((a, q) => a + (Number(q.total) || 0), 0);
    }

    function adminContestCorrect(contest) {
      return adminQuestionsFromContest(contest).reduce((a, q) => a + (Number(q.correct) || 0), 0);
    }

    function adminRowSeconds(row) {
      return adminContestsFromRow(row).reduce((a, c) => a + adminContestSeconds(c), 0);
    }

    function adminRowQuestions(row) {
      return adminContestsFromRow(row).reduce((a, c) => a + adminContestQuestions(c), 0);
    }

    function adminRowCorrect(row) {
      return adminContestsFromRow(row).reduce((a, c) => a + adminContestCorrect(c), 0);
    }

    function adminRowAccuracy(row) {
      const q = adminRowQuestions(row);
      return q ? Math.round((adminRowCorrect(row) / q) * 100) : 0;
    }

    function adminGetDate(value) {
      const d = new Date(value || 0);
      return Number.isNaN(d.getTime()) ? null : d;
    }

    function adminIsAfter(value, daysBack) {
      const d = adminGetDate(value);
      if (!d) return false;
      const limit = new Date();
      limit.setDate(limit.getDate() - daysBack);
      return d >= limit;
    }

    function adminStatTotals() {
      const rows = adminRows();
      const contests = rows.flatMap(adminContestsFromRow);
      const sessions = contests.flatMap(adminSessionsFromContest);
      const questions = contests.flatMap(adminQuestionsFromContest);
      const totalSeconds = contests.reduce((a, c) => a + adminContestSeconds(c), 0);
      const totalQuestions = contests.reduce((a, c) => a + adminContestQuestions(c), 0);
      const totalCorrect = contests.reduce((a, c) => a + adminContestCorrect(c), 0);
      const activeToday = rows.filter(r => adminIsAfter(r.updated_at || r.created_at, 1)).length;
      const active7 = rows.filter(r => adminIsAfter(r.updated_at || r.created_at, 7)).length;
      const active30 = rows.filter(r => adminIsAfter(r.updated_at || r.created_at, 30)).length;
      return {
        students: rows.length,
        contests: contests.length,
        sessions: sessions.length,
        totalSeconds,
        totalQuestions,
        totalCorrect,
        accuracy: totalQuestions ? Math.round((totalCorrect / totalQuestions) * 100) : 0,
        activeToday,
        active7,
        active30
      };
    }

    function adminStatCard(label, value, sub, icon = '📌') {

        </div>

    }

    function adminTopContestRows() {
      const map = new Map();
      adminRows().forEach(row => adminContestsFromRow(row).forEach(c => {
        const name = c.name || c.title || 'Concurso sem nome';
        const current = map.get(name) || { name, students: 0, seconds: 0, questions: 0 };
        current.students += 1;
        current.seconds += adminContestSeconds(c);
        current.questions += adminContestQuestions(c);
        map.set(name, current);
      }));
      return [...map.values()].sort((a, b) => b.seconds - a.seconds).slice(0, 8);
    }

    function adminRankingRows(type = 'hours') {
      const rows = adminRows().map(row => ({
        id: row.user_id,
        email: row.email || row.user_id || 'Aluno',
        profiles: adminProfilesFromRow(row).length,
        contests: adminContestsFromRow(row).length,
        seconds: adminRowSeconds(row),
        questions: adminRowQuestions(row),
        correct: adminRowCorrect(row),
        accuracy: adminRowAccuracy(row),
        updated_at: row.updated_at || row.created_at
      }));
      if (type === 'questions') return rows.sort((a, b) => b.questions - a.questions);
      if (type === 'accuracy') return rows.filter(r => r.questions > 0).sort((a, b) => b.accuracy - a.accuracy || b.questions - a.questions);
      if (type === 'streak') return rows.sort((a, b) => (adminIsAfter(b.updated_at, 7) ? 1 : 0) - (adminIsAfter(a.updated_at, 7) ? 1 : 0) || b.seconds - a.seconds);

    /* ===== V2.40 - CONQUISTAS, CALENDÁRIO E GRÁFICOS ADM ===== */
    function toDateKeyAprova(value) {
      if (!value) return '';
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return '';
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function secondsToHoursNumber(seconds) {
      return Math.round(((Number(seconds) || 0) / 3600) * 10) / 10;
    }

    function getContestStatsForGamification(contest) {
      const sessions = contest?.sessions || [];
      const questions = contest?.questions || [];
      const simulations = contest?.simulations || [];
      const totalSeconds = sessions.reduce((acc, s) => acc + (Number(s.duration) || 0), 0);
      const totalQuestions = questions.reduce((acc, q) => acc + (Number(q.total) || 0), 0);
      const totalCorrect = questions.reduce((acc, q) => acc + (Number(q.correct) || 0), 0);
      const accuracy = totalQuestions ? Math.round((totalCorrect / totalQuestions) * 100) : 0;
      const studiedDays = new Set(sessions.filter(s => (Number(s.duration) || 0) > 0).map(s => toDateKeyAprova(s.date)).filter(Boolean));
      const streakInfo = getStudyStreakFromDays(studiedDays);
      return { sessions, questions, simulations, totalSeconds, totalHours: secondsToHoursNumber(totalSeconds), totalQuestions, totalCorrect, accuracy, studiedDays, streak: streakInfo.current, bestStreak: streakInfo.best };
    }

    function getStudyStreakFromDays(daySet) {
      const days = [...daySet].sort();
      if (!days.length) return { current: 0, best: 0 };
      let best = 1;
      let run = 1;
      for (let i = 1; i < days.length; i++) {
        const prev = new Date(days[i - 1] + 'T12:00:00');
        const cur = new Date(days[i] + 'T12:00:00');
        const diff = Math.round((cur - prev) / 86400000);
        if (diff === 1) { run++; best = Math.max(best, run); }
        else if (diff > 1) { run = 1; }
      }
      let current = 0;
      const today = new Date();
      today.setHours(12,0,0,0);
      const yesterday = new Date(today);
      yesterday.setDate(today.getDate() - 1);
      let cursor = daySet.has(toDateKeyAprova(today)) ? today : (daySet.has(toDateKeyAprova(yesterday)) ? yesterday : null);
      while (cursor && daySet.has(toDateKeyAprova(cursor))) {
        current++;
        cursor.setDate(cursor.getDate() - 1);
      }
      return { current, best };
    }

    function getCalendarStudyMap(contest) {
      const map = new Map();
      (contest?.sessions || []).forEach(s => {
        const key = toDateKeyAprova(s.date);
        if (!key) return;
        map.set(key, (map.get(key) || 0) + (Number(s.duration) || 0));
      });
      return map;
    }

    function calendarCellClass(seconds, dailyGoalSeconds) {
      if (!seconds) return 'bg-gray-100 border-gray-200 text-gray-400';
      if (dailyGoalSeconds && seconds >= dailyGoalSeconds) return 'bg-blue-600 border-blue-700 text-white shadow-sm';
      if (seconds >= 3 * 3600) return 'bg-green-700 border-green-800 text-white';
      if (seconds >= 1 * 3600) return 'bg-green-500 border-green-600 text-white';
      return 'bg-green-200 border-green-300 text-green-900';
    }

    function renderStudyCalendar(contest) {
      const studyMap = getCalendarStudyMap(contest);
      const stats = getContestStatsForGamification(contest);
      const dailyGoalSeconds = getDailyGoalSeconds(contest);
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth();
      const first = new Date(year, month, 1);
      const last = new Date(year, month + 1, 0);
      const startOffset = first.getDay();
      const totalSlots = Math.ceil((startOffset + last.getDate()) / 7) * 7;
      const monthName = first.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
      const cells = [];
      for (let i = 0; i < totalSlots; i++) {
        const dayNum = i - startOffset + 1;
        if (dayNum < 1 || dayNum > last.getDate()) {
          cells.push(`<div class="h-16 rounded-2xl border border-transparent"></div>`);
          continue;
        }
        const d = new Date(year, month, dayNum, 12, 0, 0);
        const key = toDateKeyAprova(d);
        const seconds = studyMap.get(key) || 0;
        const cls = calendarCellClass(seconds, dailyGoalSeconds);
        cells.push(`<div title="${dayNum} - ${formatTime(seconds)}" class="h-16 rounded-2xl border ${cls} flex flex-col items-center justify-center transition hover:scale-[1.03]"><span class="text-sm font-black">${dayNum}</span><span class="text-[10px] font-bold opacity-90">${seconds ? formatTime(seconds).slice(0,5) : ''}</span></div>`);
      }
      return `<div class="premium-tab-shell fade-in">
        <div class="premium-tab-hero">
          <p class="premium-tab-eyebrow">Constância</p>
          <h1 class="premium-tab-title">Calendário de Estudos</h1>

          ${adminStatCard('Meta diária', formatTime(dailyGoalSeconds), 'referência do plano', '🎯')}
        </div>
        <div class="bg-white rounded-3xl border border-gray-100 shadow-sm p-6">
          <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
            <div><h2 class="text-2xl font-black text-navy-900 capitalize">${monthName}</h2><p class="text-sm text-gray-500">Calendário colorido por intensidade de estudo</p></div>
            <div class="flex flex-wrap gap-2 text-xs font-bold text-gray-600">
              <span class="inline-flex items-center gap-1"><i class="w-3 h-3 rounded bg-gray-100 border inline-block"></i>Sem estudo</span>
              <span class="inline-flex items-center gap-1"><i class="w-3 h-3 rounded bg-green-200 border inline-block"></i>Até 1h</span>
              <span class="inline-flex items-center gap-1"><i class="w-3 h-3 rounded bg-green-500 inline-block"></i>1h a 3h</span>
              <span class="inline-flex items-center gap-1"><i class="w-3 h-3 rounded bg-green-700 inline-block"></i>3h+</span>
              <span class="inline-flex items-center gap-1"><i class="w-3 h-3 rounded bg-blue-600 inline-block"></i>Meta</span>
            </div>
          </div>
          <div class="grid grid-cols-7 gap-2 mb-2 text-center text-xs font-black text-gray-500"><div>Dom</div><div>Seg</div><div>Ter</div><div>Qua</div><div>Qui</div><div>Sex</div><div>Sáb</div></div>

      return `<div class="premium-tab-shell fade-in">

            <div class="absolute right-[-28px] top-[-28px] w-24 h-24 rounded-full ${a.unlocked ? 'bg-amber-100' : 'bg-gray-100'}"></div>
            <div class="relative">
              <div class="w-14 h-14 rounded-2xl ${a.unlocked ? 'bg-amber-100 text-amber-700' : 'bg-gray-100 text-gray-500'} flex items-center justify-center text-3xl mb-4">${a.icon}</div>
              <div class="flex items-start justify-between gap-3"><div><h3 class="font-black text-navy-900">${a.title}</h3><p class="text-sm text-gray-500 mt-1">${a.description}</p></div>${a.unlocked ? '<span class="px-2 py-1 rounded-full bg-green-100 text-green-700 text-xs font-black">LIBERADA</span>' : '<span class="px-2 py-1 rounded-full bg-gray-100 text-gray-500 text-xs font-black">EM PROGRESSO</span>'}</div>
              <div class="mt-5"><div class="flex justify-between text-xs font-bold text-gray-500 mb-1"><span>${Math.min(a.current, a.target)}${a.suffix || ''}/${a.target}${a.suffix || ''}</span><span>${a.pct}%</span></div><div class="h-3 bg-gray-100 rounded-full overflow-hidden"><div class="h-full ${a.unlocked ? 'bg-amber-500' : 'bg-accent-500'} rounded-full" style="width:${a.pct}%"></div></div></div>
            </div>
          </div>`).join('')}
        </div>
      </div>`;
    }

    function adminMonthlyHoursChart() {
      const months = [];
      const now = new Date();
      for (let i = 5; i >= 0; i--) {
        const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
        months.push({ key, label: d.toLocaleDateString('pt-BR', { month:'short' }).replace('.', ''), seconds: 0 });
      }
      adminRows().forEach(row => adminContestsFromRow(row).forEach(c => adminSessionsFromContest(c).forEach(s => {
        const key = toDateKeyAprova(s.date).slice(0,7);
        const item = months.find(m => m.key === key);
        if (item) item.seconds += Number(s.duration) || 0;
      })));
      return renderSimpleBarChart(months.map(m => ({ label: m.label, value: secondsToHoursNumber(m.seconds), text: formatTime(m.seconds) })), 'Horas por mês');
    }

    function adminSubjectChart() {
      const map = new Map();
      adminRows().forEach(row => adminContestsFromRow(row).forEach(c => adminSessionsFromContest(c).forEach(s => {
        const name = s.topicName || s.subject || 'Sem matéria';
        map.set(name, (map.get(name) || 0) + (Number(s.duration) || 0));
      })));
      const data = [...map.entries()].map(([label, seconds]) => ({ label, value: seconds, text: formatTime(seconds) })).sort((a,b)=>b.value-a.value).slice(0,8);
      return renderSimpleBarChart(data, 'Matérias mais estudadas');
    }

    function renderSimpleBarChart(data, title) {
      if (!data.length) return `<div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6"><h3 class="font-black text-navy-900 mb-4">${title}</h3><p class="text-sm text-gray-500">Ainda não há dados suficientes.</p></div>`;
      const max = Math.max(...data.map(d => d.value), 1);
      return `<div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6"><h3 class="font-black text-navy-900 mb-4">${title}</h3><div class="space-y-3">${data.map(d => { const pct = Math.max(6, Math.round((d.value/max)*100)); return `<div><div class="flex justify-between text-sm mb-1"><span class="font-bold text-navy-900 truncate pr-3">${escapeHtml(d.label)}</span><span class="text-gray-500 whitespace-nowrap">${d.text}</span></div><div class="h-3 bg-gray-100 rounded-full overflow-hidden"><div class="h-full bg-accent-500 rounded-full" style="width:${pct}%"></div></div></div>`; }).join('')}</div></div>`;
    }

    function renderAdminOverviewPanel(totals = adminStatTotals()) {
      const topContests = adminTopContestRows();
      return `<div class="space-y-6">
        <div class="bg-gradient-to-r from-navy-900 to-accent-600 rounded-3xl shadow-sm p-7 text-white">
          <p class="text-accent-100 text-sm font-bold uppercase tracking-wide">Dashboard Administrativo</p>
          <h2 class="text-3xl font-black mt-1">Visão geral da plataforma</h2>
          <p class="text-accent-100 mt-2">Agora com gráficos de crescimento, rankings e engajamento dos alunos.</p>
        </div>
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
          ${adminStatCard('Alunos', totals.students, 'Usuários com dados no app', '👥')}
          ${adminStatCard('Ativos hoje', totals.activeToday, `${totals.active7} ativos em 7 dias`, '⚡')}
          ${adminStatCard('Horas registradas', formatTime(totals.totalSeconds), 'Soma geral dos alunos', '⏱️')}
          ${adminStatCard('Questões', totals.totalQuestions, `${totals.accuracy}% de acerto médio`, '✅')}
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">${adminMonthlyHoursChart()}${adminSubjectChart()}</div>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
          <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6"><h3 class="font-black text-navy-900 mb-1">Concursos mais movimentados</h3><p class="text-sm text-gray-500 mb-4">Ranking por horas registradas.</p>${topContests.length ? `<div class="space-y-3">${topContests.map((c, idx) => { const pct = topContests[0]?.seconds ? Math.max(7, Math.round((c.seconds / topContests[0].seconds) * 100)) : 0; return `<div><div class="flex justify-between text-sm mb-1"><span class="font-bold text-navy-900">${idx + 1}. ${escapeHtml(c.name)}</span><span class="text-gray-500">${formatTime(c.seconds)}</span></div><div class="h-2 bg-gray-100 rounded-full overflow-hidden"><div class="h-full bg-accent-500 rounded-full" style="width:${pct}%"></div></div><p class="text-xs text-gray-400 mt-1">${c.students} aluno(s) • ${c.questions} questões</p></div>`; }).join('')}</div>` : `<p class="text-sm text-gray-500">Nenhum concurso com dados ainda.</p>`}</div>
          <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6"><h3 class="font-black text-navy-900 mb-1">Engajamento</h3><p class="text-sm text-gray-500 mb-4">Leitura rápida da movimentação.</p><div class="grid grid-cols-3 gap-3">${adminStatCard('Hoje', totals.activeToday, 'alunos', '📅')}${adminStatCard('7 dias', totals.active7, 'alunos', '🔥')}${adminStatCard('30 dias', totals.active30, 'alunos', '📈')}</div><div class="mt-4 p-4 rounded-2xl bg-accent-50 border border-accent-100"><p class="font-black text-accent-700">Resumo</p><p class="text-sm text-navy-700 mt-1">${totals.students ? `A plataforma tem ${totals.students} aluno(s), ${totals.contests} concurso(s) e ${formatTime(totals.totalSeconds)} registrados.` : 'Assim que os alunos usarem o sistema, os números aparecerão aqui.'}</p></div></div>
        </div>
        <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6"><div class="flex items-center justify-between mb-4"><div><h3 class="font-black text-navy-900">Alunos recentes</h3><p class="text-sm text-gray-500">Clique em “Ver” para abrir a estatística individual.</p></div><button onclick="openAdminPanel('students')" class="px-4 py-2 bg-accent-50 text-accent-600 rounded-xl font-bold text-sm">Ver estatísticas dos alunos</button></div>${renderAdminStudentsTable()}</div>
      </div>`;
    }

    function renderAdminRankingTable(type, title, subtitle) {
      const rows = adminRankingRows(type).slice(0, 10);
      if (!rows.length) return `<div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-8 text-center text-gray-500">Ainda não há dados para ${title.toLowerCase()}.</div>`;
      const medal = i => i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i+1}`;
      return `<div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6"><div class="flex items-center justify-between mb-4"><div><h3 class="font-black text-navy-900">${title}</h3><p class="text-sm text-gray-500">${subtitle}</p></div></div><div class="space-y-2">${rows.map((r,i)=>`<div class="flex items-center justify-between gap-3 p-3 rounded-2xl border ${i<3?'border-amber-100 bg-amber-50':'border-gray-100 bg-gray-50'}"><div class="flex items-center gap-3 min-w-0"><div class="w-11 h-11 rounded-2xl ${i<3?'bg-white text-amber-700':'bg-accent-50 text-accent-600'} flex items-center justify-center font-black text-lg">${medal(i)}</div><div class="min-w-0"><p class="font-black text-navy-900 truncate">${escapeHtml(r.email)}</p><p class="text-xs text-gray-500">${r.contests} concurso(s) • ${r.profiles} perfil(is)</p></div></div><div class="text-right"><p class="font-black text-navy-900">${type === 'questions' ? r.questions : type === 'accuracy' ? `${r.accuracy}%` : formatTime(r.seconds)}</p><p class="text-xs text-gray-500">${type === 'accuracy' ? `${r.correct}/${r.questions} acertos` : `${r.accuracy}% acerto`}</p></div></div>`).join('')}</div></div>`;
    }


    initializeAprovaPolicial();
  </script>
</body>
</html>
