<body class="h-full bg-gray-50 font-inter">
  <div id="app" class="h-full overflow-auto"></div>

  <script>
    // ===== STATE MANAGEMENT =====
    const APP_KEY = 'aprovapolicial_data';
    
    let state = {
      currentScreen: 'profiles',
      currentProfile: null,
      currentContest: null,
      currentSyllabusTopicId: null, // for Edital > Tópico details
      sessionPrefill: { topicId: null, subtopicId: null },
      currentSyllabusTemplateId: null,
      currentSyllabusArea: null,
      profileSyllabusLibraryOpen: false,
      profiles: [],
      // Timer state (duration stored in seconds)
      timerRunning: false,
      timerSeconds: 0, // derived elapsed seconds for display
      timerStartEpoch: null, // Date.now() when current run started
      timerAccumulatedSeconds: 0, // seconds accumulated from previous runs
      timerInterval: null
    };

    // Default config
    const defaultConfig = {
      app_title: 'Aprova Policial',
      welcome_message: 'Bem-vindo ao seu sistema de estudos',
      primary_color: '#102a43',
      secondary_color: '#0967d2',
      background_color: '#f8fafc',
      text_color: '#1e293b',
      accent_color: '#47a3f3',
      font_family: 'Inter',
      font_size: 16
    };

    let config = { ...defaultConfig };

    // ===== LOCAL STORAGE =====
    function saveToStorage() {
      const data = {
        profiles: state.profiles,
        lastBackup: new Date().toISOString()
      };
      localStorage.setItem(APP_KEY, JSON.stringify(data));
    }

    function loadFromStorage() {
      const data = localStorage.getItem(APP_KEY);
      if (data) {
        const parsed = JSON.parse(data);
        state.profiles = parsed.profiles || [];
      }
    }

    // ===== UTILITY FUNCTIONS =====
    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).substr(2);
    }

    function formatDate(date) {
      return new Date(date).toLocaleDateString('pt-BR');
    }

function getCurrentContest() {
  const profile = state.profiles.find(p => p.id === state.currentProfile);
  return profile?.contests?.find(c => c.id === state.currentContest) || null;
}

function getTopicById(contest, topicId) {
  return contest?.syllabus?.find(t => t.id === topicId) || null;
}

function getSubtopicById(topic, subtopicId) {
  return topic?.subtopics?.find(st => st.id === subtopicId) || null;
}

function updateTopicAggregates(contest, topicId) {
  // Recompute topic question stats from all question blocks tied to the topic (including subtópicos)
  const topic = getTopicById(contest, topicId);
  if (!topic) return;
  const blocks = (contest.questions || []).filter(q => q.topicId === topicId);
  const total = blocks.reduce((acc, q) => acc + (q.total || 0), 0);
  const correct = blocks.reduce((acc, q) => acc + (q.correct || 0), 0);
  topic.questions = total;
  topic.accuracy = total > 0 ? Math.round((correct / total) * 100) : 0;

  // Aggregate time from subtópicos (timeSpent is stored in minutes) + keep existing topic.timeSpent (which may include direct time)
  if (Array.isArray(topic.subtopics) && topic.subtopics.length > 0) {
    const subMin = topic.subtopics.reduce((acc, st) => acc + (st.timeSpent || 0), 0);
    // If topic.timeSpent already includes subtópicos (because we add to it), keep it; otherwise ensure minimum equals subMin
    topic.timeSpent = Math.max(topic.timeSpent || 0, subMin);
  }
}

function updateSubtopicStats(contest, topicId, subtopicId) {
  const topic = getTopicById(contest, topicId);
  const sub = getSubtopicById(topic, subtopicId);
  if (!topic || !sub) return;
  const blocks = (contest.questions || []).filter(q => q.topicId === topicId && q.subtopicId === subtopicId);
  const total = blocks.reduce((acc, q) => acc + (q.total || 0), 0);
  const correct = blocks.reduce((acc, q) => acc + (q.correct || 0), 0);
  sub.questions = total;
  sub.accuracy = total > 0 ? Math.round((correct / total) * 100) : 0;
}



function recomputeTopicNextReview(topic) {
  if (!topic) return;
  const dates = [];
  if (topic.nextReview) dates.push(topic.nextReview);
  (topic.subtopics || []).forEach(st => { if (st.nextReview) dates.push(st.nextReview); });
  if (dates.length === 0) {
    topic.nextReview = null;
    return;
  }
  const minIso = dates
    .map(d => ({ iso: d, t: new Date(d).getTime() }))
    .filter(o => !Number.isNaN(o.t))
    .sort((a,b) => a.t - b.t)[0]?.iso;
  topic.nextReview = minIso || topic.nextReview || null;
}

function syncNextReviews(contest) {
  if (!contest) return;
  const syllabus = contest.syllabus || [];
  syllabus.forEach(t => {
    t.nextReview = null;
    (t.subtopics || []).forEach(st => { st.nextReview = null; });
  });

  const pending = (contest.reviews || []).filter(r => !r.completed && r.dueDate);
  pending.forEach(r => {
    const topic = syllabus.find(t => t.id === r.topicId);
    if (!topic) return;
    if (r.subtopicId) {
      const st = (topic.subtopics || []).find(s => s.id === r.subtopicId);
      if (st) {
        if (!st.nextReview || new Date(r.dueDate).getTime() < new Date(st.nextReview).getTime()) st.nextReview = r.dueDate;
      }
    } else {
      if (!topic.nextReview || new Date(r.dueDate).getTime() < new Date(topic.nextReview).getTime()) topic.nextReview = r.dueDate;
    }
  });

  syllabus.forEach(t => recomputeTopicNextReview(t));
}

function getWeekRange(weekOffset = 0) {
  const now = new Date();
  const start = new Date(now);
  start.setHours(0,0,0,0);
  start.setDate(start.getDate() - start.getDay() + (weekOffset * 7));
  const end = new Date(start);
  end.setDate(end.getDate() + 7);
  return { start, end };
}

function isDateInRange(dateLike, start, end) {
  const d = new Date(dateLike);
  return d >= start && d < end;
}

function getContestReportView(contest) {
  contest.reportView = contest.reportView || { mode: 'pre', weekOffset: 0 };
  if (!['pre','post'].includes(contest.reportView.mode)) contest.reportView.mode = 'pre';
  if (typeof contest.reportView.weekOffset !== 'number') contest.reportView.weekOffset = 0;
  return contest.reportView;
}

function setReportMode(mode) {
  const contest = getCurrentContest();
  if (!contest) return;
  const view = getContestReportView(contest);
  view.mode = mode === 'post' ? 'post' : 'pre';
  saveToStorage();
  render();
}

function changeReportWeek(delta) {
  const contest = getCurrentContest();
  if (!contest) return;
  const view = getContestReportView(contest);
  view.weekOffset += delta;
  saveToStorage();
  render();
}

function resetReportWeek() {
  const contest = getCurrentContest();
  if (!contest) return;
  const view = getContestReportView(contest);
  view.weekOffset = 0;
  saveToStorage();
  render();
}


function toISODateOnly(dateLike) {
  const d = new Date(dateLike);
  if (Number.isNaN(d.getTime())) return '';
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function getDateFromISODateOnly(iso) {
  if (!iso) return null;
  const [y, m, d] = iso.split('-').map(Number);
  if (!y || !m || !d) return null;
  return new Date(y, m - 1, d);
}

function formatMonthYear(dateLike) {
  return new Date(dateLike).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }).replace(/^./, c => c.toUpperCase());
}

function getReportViewState(contest) {
  contest.reportView = contest.reportView || {};
  const view = contest.reportView;
  if (!['week', 'month', 'custom'].includes(view.periodType)) view.periodType = 'week';
  if (typeof view.weekOffset !== 'number') view.weekOffset = 0;
  if (typeof view.monthOffset !== 'number') view.monthOffset = 0;
  if (!view.customStart) view.customStart = toISODateOnly(new Date());
  if (!view.customEnd) view.customEnd = toISODateOnly(new Date());
  return view;
}

function getReportRange(contest) {
  const view = getReportViewState(contest);
  if (view.periodType === 'month') {
    const now = new Date();
    const start = new Date(now.getFullYear(), now.getMonth() + view.monthOffset, 1);
    start.setHours(0,0,0,0);
    const end = new Date(start.getFullYear(), start.getMonth() + 1, 1);
    return { start, end, label: formatMonthYear(start), calendarDate: start };
  }
  if (view.periodType === 'custom') {
    let start = getDateFromISODateOnly(view.customStart) || new Date();
    let endBase = getDateFromISODateOnly(view.customEnd) || start;
    start.setHours(0,0,0,0);
    endBase.setHours(0,0,0,0);
    if (endBase < start) {
      const tmp = start;
      start = endBase;
      endBase = tmp;
    }
    const end = new Date(endBase);
    end.setDate(end.getDate() + 1);
    return { start, end, label: `${formatDate(start)} — ${formatDate(endBase)}`, calendarDate: start };
  }
  const range = getWeekRange(view.weekOffset || 0);
  const endDisplay = new Date(range.end.getTime() - 86400000);
  return { start: range.start, end: range.end, label: `${formatDate(range.start)} — ${formatDate(endDisplay)}`, calendarDate: range.start };
}

function setReportPeriodType(type) {
  const contest = getCurrentContest();
  if (!contest) return;
  const view = getReportViewState(contest);
  view.periodType = ['week','month','custom'].includes(type) ? type : 'week';
  saveToStorage();
  render();
}

function changeReportPeriod(delta) {
  const contest = getCurrentContest();
  if (!contest) return;
  const view = getReportViewState(contest);
  if (view.periodType === 'month') {
    view.monthOffset += delta;
  } else if (view.periodType === 'custom') {
    const start = getDateFromISODateOnly(view.customStart) || new Date();
    const end = getDateFromISODateOnly(view.customEnd) || start;
    const days = Math.max(1, Math.round((end - start) / 86400000) + 1);
    start.setDate(start.getDate() + (delta * days));
    end.setDate(end.getDate() + (delta * days));
    view.customStart = toISODateOnly(start);
    view.customEnd = toISODateOnly(end);
  } else {
    view.weekOffset += delta;
  }
  saveToStorage();
  render();
}

function resetReportPeriod() {
  const contest = getCurrentContest();
  if (!contest) return;
  const view = getReportViewState(contest);
  view.weekOffset = 0;
  view.monthOffset = 0;
  const today = toISODateOnly(new Date());
  view.customStart = today;
  view.customEnd = today;
  saveToStorage();
  render();
}

function applyReportCustomRange() {
  const contest = getCurrentContest();
  if (!contest) return;
  const view = getReportViewState(contest);
  const start = document.getElementById('report-custom-start')?.value;
  const end = document.getElementById('report-custom-end')?.value;
  if (!start || !end) {
    alert('Selecione a data inicial e a data final.');
    return;
  }
  view.periodType = 'custom';
  view.customStart = start;
  view.customEnd = end;
  saveToStorage();
  render();
}

function showReportDayDetails(dateIso) {
  const contest = getCurrentContest();
  if (!contest) return;
  const mode = getActiveContestMode(contest);
  const sessions = (contest.sessions || []).filter(s => (s.planMode || 'pre') === mode && toISODateOnly(s.date) === dateIso);
  const questions = (contest.questions || []).filter(q => (q.planMode || 'pre') === mode && toISODateOnly(q.date) === dateIso);
  const totalSeconds = sessions.reduce((acc, s) => acc + (s.duration || 0), 0);
  const totalQuestions = questions.reduce((acc, q) => acc + (q.total || 0), 0);
  const correctQuestions = questions.reduce((acc, q) => acc + (q.correct || 0), 0);
  const accuracy = totalQuestions > 0 ? Math.round((correctQuestions / totalQuestions) * 100) : 0;
  const dateObj = getDateFromISODateOnly(dateIso) || new Date(dateIso);

  showModal(`
    <div class="p-6 max-w-2xl">
      <div class="flex items-start justify-between gap-3 mb-5">
        <div>
          <h3 class="text-2xl font-bold text-navy-900">${formatDate(dateObj)}</h3>
          <p class="text-sm text-gray-500 mt-1">Detalhamento das atividades do dia</p>
        </div>
        <button onclick="closeModal()" class="p-2 text-gray-400 hover:text-gray-600 rounded-lg">${icons.x}</button>
      </div>

      <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
        <div class="bg-gray-50 rounded-xl border border-gray-100 p-3">

        <div class="bg-gray-50 rounded-xl border border-gray-100 p-3">

        </div>
        <div class="bg-gray-50 rounded-xl border border-gray-100 p-3">
          <p class="text-xs text-gray-500">Questões</p>
          <p class="text-xl font-bold text-navy-900">${totalQuestions}</p>
        </div>
        <div class="bg-gray-50 rounded-xl border border-gray-100 p-3">
          <p class="text-xs text-gray-500">Acerto</p>
          <p class="text-xl font-bold ${accuracy >= 70 ? 'text-green-600' : accuracy >= 50 ? 'text-amber-600' : 'text-red-600'}">${accuracy}%</p>
        </div>
      </div>

      <div class="space-y-3">
        ${sessions.length === 0 && questions.length === 0 ? `
          <div class="text-center py-8 text-gray-500">Nenhuma atividade registrada neste dia.</div>
        ` : ''}

        ${sessions.map(s => `
          <div class="border border-gray-100 rounded-xl p-4 bg-white">
            <div class="flex items-start justify-between gap-4">
              <div class="min-w-0">
                <div class="flex items-center gap-2 mb-1">
                  <span class="w-3 h-3 rounded-full bg-green-500"></span>
                  <p class="font-semibold text-navy-900 truncate">${s.topicName || 'Sem tópico'}</p>
                </div>
                <p class="text-sm text-gray-600">${s.subtopicName ? s.subtopicName : 'Sem subtópico informado'}</p>
                <p class="text-xs text-gray-400 mt-2">Tipo: ${s.type === 'questions' ? 'Questões' : s.type === 'review' ? 'Revisão' : s.type === 'video' ? 'Videoaula' : 'Teoria'}</p>
              </div>
              <div class="text-right whitespace-nowrap">
                <p class="text-sm text-gray-500">${new Date(s.date).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}</p>
                <p class="font-semibold text-navy-900">${formatTime(s.duration || 0)}</p>
              </div>
            </div>
          </div>
        `).join('')}

        ${questions.map(q => {
          const qAcc = (q.total || 0) > 0 ? Math.round(((q.correct || 0) / (q.total || 0)) * 100) : 0;
          return `
            <div class="border border-gray-100 rounded-xl p-4 bg-gray-50">
              <div class="flex items-start justify-between gap-4">
                <div class="min-w-0">
                  <div class="flex items-center gap-2 mb-1">
                    <span class="w-3 h-3 rounded-full bg-accent-500"></span>
                    <p class="font-semibold text-navy-900 truncate">${q.topicName || 'Questões'}</p>
                  </div>
                  <p class="text-sm text-gray-600">${q.subtopicName ? q.subtopicName : (q.source || 'Bloco de questões')}</p>
                  <p class="text-xs text-gray-400 mt-2">${q.correct || 0}/${q.total || 0} acertos</p>
                </div>
                <div class="text-right whitespace-nowrap">
                  <p class="text-sm text-gray-500">${new Date(q.date).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}</p>
                  <p class="font-semibold ${qAcc >= 70 ? 'text-green-600' : qAcc >= 50 ? 'text-amber-600' : 'text-red-600'}">${qAcc}%</p>
                </div>

          `;
        }).join('')}
      </div>
    </div>
  `);
}

function hexToRgb(hex) {
  const raw = hex.replace('#','');
  const full = raw.length === 3 ? raw.split('').map(c => c+c).join('') : raw;
  const num = parseInt(full, 16);
  return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
}

function rgba(hex, alpha) {
  const {r,g,b} = hexToRgb(hex);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

function describeArc(cx, cy, r, startAngle, endAngle) {
  const rad = Math.PI / 180;
  const start = {
    x: cx + r * Math.cos((startAngle - 90) * rad),
    y: cy + r * Math.sin((startAngle - 90) * rad)
  };
  const end = {
    x: cx + r * Math.cos((endAngle - 90) * rad),
    y: cy + r * Math.sin((endAngle - 90) * rad)
  };
  const largeArc = endAngle - startAngle <= 180 ? 0 : 1;
  return `M ${cx} ${cy} L ${start.x} ${start.y} A ${r} ${r} 0 ${largeArc} 1 ${end.x} ${end.y} Z`;
}

function renderPieChartSvg(data, title, emptyText) {
  const palette = ['#0967d2','#7c3aed','#059669','#d97706','#dc2626','#0891b2','#84cc16','#f43f5e'];
  if (!data || data.length === 0) {
    return `<div class="text-center py-10 text-gray-500">${emptyText}</div>`;
  }
  const total = data.reduce((acc, item) => acc + item.value, 0);
  let currentAngle = 0;
  const slices = data.map((item, idx) => {
    const angle = total > 0 ? (item.value / total) * 360 : 0;
    const path = describeArc(80, 80, 70, currentAngle, currentAngle + angle);
    const color = palette[idx % palette.length];
    currentAngle += angle;
    return `<path d="${path}" fill="${color}" opacity="0.95"></path>`;
  }).join('');

  return `

function renderMiniBarChart(data) {
  if (!data || data.length === 0) {
    return `<div class="text-center py-10 text-gray-500">Sem sessões registradas nesta semana.</div>`;

  const max = Math.max(...data.map(d => d.value), 1);
  return `
    <div class="h-52 flex items-end justify-around gap-2 px-2">
      ${data.map(item => `
        <div class="flex flex-col items-center gap-2 flex-1">
          <div class="w-full max-w-[38px] bg-accent-500 rounded-t" style="height:${Math.max(8, Math.round((item.value / max) * 150))}px"></div>

function saveManualSession() {
  const profile = state.profiles.find(p => p.id === state.currentProfile);
  const contest = profile?.contests?.find(c => c.id === state.currentContest);
  if (!contest) return;

  const topicSelect = document.getElementById('manual-session-topic');
  const subtopicSelect = document.getElementById('manual-session-subtopic');
  const typeSelect = document.getElementById('manual-session-type');
  const hoursInput = document.getElementById('manual-session-hours');
  const minutesInput = document.getElementById('manual-session-minutes');
  const secondsInput = document.getElementById('manual-session-seconds');

  const topicId = topicSelect?.value || null;
  const subtopicId = subtopicSelect?.value || null;
  const hours = parseInt(hoursInput?.value || '0', 10) || 0;
  const minutes = parseInt(minutesInput?.value || '0', 10) || 0;
  const seconds = parseInt(secondsInput?.value || '0', 10) || 0;

  const totalSeconds = Math.max(0, (hours * 3600) + (minutes * 60) + seconds);
  if (!topicId || totalSeconds <= 0) {
    alert('Selecione um tópico e informe um tempo maior que zero.');
    return;
  }

  const topic = contest.syllabus?.find(t => t.id === topicId);
  const subtopic = (topic && subtopicId) ? (topic.subtopics || []).find(st => st.id === subtopicId) : null;

  const session = {
    id: generateId(),
    topicId,
    topicName: topic?.name || 'Sem tópico',
    subtopicId,
    subtopicName: subtopic?.name || null,
    type: typeSelect?.value || 'theory',
    duration: totalSeconds,
    date: new Date().toISOString(),
    planMode: getActiveContestMode(contest),
    manualEntry: true
  };

  contest.sessions = contest.sessions || [];
  contest.sessions.unshift(session);

  if (topic) {
    topic.timeSpent = (topic.timeSpent || 0) + Math.round(totalSeconds / 60);
    topic.lastStudied = new Date().toISOString();

    if (subtopic) {
      subtopic.timeSpent = (subtopic.timeSpent || 0) + Math.round(totalSeconds / 60);
      subtopic.lastStudied = new Date().toISOString();
    }

    if ((typeSelect?.value || 'theory') === 'theory') {
      const intervals = contest.reviewSettings?.intervals || [1, 7, 30];
      const reviewDate = new Date();
      reviewDate.setDate(reviewDate.getDate() + intervals[0]);
      createManualReview(contest, topicId, subtopic ? subtopic.id : null, reviewDate.toISOString());
    }
  }

  if (subtopicId) updateSubtopicStats(contest, topicId, subtopicId);
  updateTopicAggregates(contest, topicId);
  saveToStorage();
  render();
}

function applySessionPrefillIfAny() {
  const contest = getCurrentContest();
  if (!contest) return;
  if (!state.sessionPrefill) return;

  const topicSelect = document.getElementById('session-topic');
  const subSelect = document.getElementById('session-subtopic');
  if (!topicSelect || !subSelect) return;

  if (state.sessionPrefill.topicId) {
    topicSelect.value = state.sessionPrefill.topicId;
  }
  updateSessionSubtopicOptions();
  if (state.sessionPrefill.subtopicId) {
    subSelect.value = state.sessionPrefill.subtopicId;
  }
}

function createManualReview(contest, topicId, subtopicId, dueDateIso) {
  if (!contest) return;
  const topic = getTopicById(contest, topicId);
  if (!topic) return;
  const sub = subtopicId ? getSubtopicById(topic, subtopicId) : null;

  contest.reviews = contest.reviews || [];
  contest.reviews.push({
    id: generateId(),
    topicId,
    topicName: topic.name,
    subtopicId: sub ? sub.id : null,
    subtopicName: sub ? sub.name : null,
    dueDate: dueDateIso,
    completed: false,
    interval: 0
  });

  // Store nextReview at the most specific level
  if (sub) {
    sub.nextReview = dueDateIso;
  } else {
    topic.nextReview = dueDateIso;
  }

  // Also keep topic.nextReview as the nearest review among its subtopics / itself
  syncNextReviews(contest);
}

    function renderTabContent(tab, contest) {
      switch(tab) {
        case 'dashboard': return renderDashboard(contest);
        case 'syllabus': return renderSyllabus(contest);
        case 'plan': return renderPlan(contest);
        case 'sessions': return renderSessions(contest);
        case 'questions': return renderQuestions(contest);
        case 'reviews': return renderReviews(contest);
        case 'simulations': return renderSimulations(contest);
        case 'files': return renderFiles(contest);
        case 'reports': return renderReports(contest);
        case 'backup': return renderBackup(contest);
        default: return renderDashboard(contest);
      }
    }

    function renderDashboard(contest) {
      const syllabus = contest.syllabus || [];
      const sessions = contest.sessions || [];
      const questions = contest.questions || [];
      const reviews = contest.reviews || [];
      
      const progress = calculateProgress(syllabus);
      const totalHours = sessions.reduce((acc, s) => acc + (s.duration || 0), 0);
      const weekHours = sessions.filter(s => {
        const sessionDate = new Date(s.date);
        const weekAgo = new Date();
        weekAgo.setDate(weekAgo.getDate() - 7);
        return sessionDate >= weekAgo;
      }).reduce((acc, s) => acc + (s.duration || 0), 0);
      
      const totalQuestions = questions.reduce((acc, q) => acc + (q.total || 0), 0);
      const correctQuestions = questions.reduce((acc, q) => acc + (q.correct || 0), 0);
      const accuracy = totalQuestions > 0 ? Math.round((correctQuestions / totalQuestions) * 100) : 0;
      
      const pendingReviews = reviews.filter(r => !r.completed && new Date(r.dueDate) <= new Date()).length;

      // Suggestions
      const suggestions = [];
      const lowPerformanceTopics = syllabus.filter(s => s.accuracy && s.accuracy < 60);
      const overdueReviews = reviews.filter(r => !r.completed && new Date(r.dueDate) < new Date());
      
      if (overdueReviews.length > 0) {
        suggestions.push({ type: 'review', text: `${overdueReviews.length} revisão(ões) atrasada(s)`, priority: 'high' });
      }
      if (lowPerformanceTopics.length > 0) {
        suggestions.push({ type: 'study', text: `Revisar: ${lowPerformanceTopics[0]?.name || 'Tópico com baixo desempenho'}`, priority: 'medium' });
      }
      const notStudied = syllabus.filter(s => !s.lastStudied);
      if (notStudied.length > 0) {
        suggestions.push({ type: 'new', text: `Iniciar: ${notStudied[0]?.name || 'Novo tópico'}`, priority: 'low' });
      }

      return `
        <div class="p-6 fade-in">
          <div class="mb-6">
            <h1 class="text-2xl font-bold text-navy-900">Dashboard</h1>
            <p class="text-gray-500">Visão geral do seu progresso</p>
          </div>

          <!-- Stats Grid -->
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
              <div class="flex items-center justify-between mb-3">
                <span class="text-gray-500 text-sm">Progresso do Edital</span>
                <div class="w-8 h-8 bg-accent-100 rounded-lg flex items-center justify-center text-accent-600">
                  ${icons.target}
                </div>
              </div>
              <p class="text-3xl font-bold text-navy-900">${progress}%</p>
              <div class="mt-2 h-2 bg-gray-100 rounded-full">
                <div class="h-full bg-accent-500 rounded-full transition-all" style="width: ${progress}%"></div>
              </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5">

function getCurrentProfile() {
  return state.profiles.find(p => p.id === state.currentProfile) || null;
}

function getSyllabusTemplates() {
  const profile = getCurrentProfile();
  if (!profile) return [];
  profile.syllabusTemplates = profile.syllabusTemplates || [];
  return profile.syllabusTemplates;
}

function countTemplateSubtopics(template) {
  return (template.topics || []).reduce((acc, topic) => acc + ((topic.subtopics || []).length), 0);
}

function normalizeAreaName(area) {
  const value = (area || '').trim();
  return value || 'Geral';
}

function getTemplateArea(template) {
  return normalizeAreaName(template?.area || template?.careerArea || template?.category);
}

function getContestArea(contest) {
  return normalizeAreaName(contest?.area || contest?.careerArea || contest?.category);
}

function getSyllabusTemplateAreas() {
  const templates = getSyllabusTemplates();
  const areas = [...new Set(templates.map(t => getTemplateArea(t)))];
  return areas.sort((a, b) => a.localeCompare(b, 'pt-BR'));
}

function getDefaultContestAreas() {
  return ['Policial', 'Tribunal', 'Saúde', 'Educação', 'Fiscal', 'Administrativa', 'Outros'];
}

function renderPlan(contest) {
  const plan = contest.plan || { mode: getActiveContestMode(contest), weeklyGoal: 20, questionGoal: 100, schedules: {
    pre: {0:[],1:[],2:[],3:[],4:[],5:[],6:[]},
    post:{0:[],1:[],2:[],3:[],4:[],5:[],6:[]}
  } };
  plan.schedules = plan.schedules || {
    pre: {0:[],1:[],2:[],3:[],4:[],5:[],6:[]},
    post:{0:[],1:[],2:[],3:[],4:[],5:[],6:[]}
  };
  const activeMode = getActiveContestMode(contest);
  const activeSchedule = plan.schedules[activeMode] || (plan.schedules[activeMode] = {0:[],1:[],2:[],3:[],4:[],5:[],6:[]});

  const syllabus = contest.syllabus || [];
  const days = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];

  function renderScheduleItem(item, dayIndex) {
    const topic = syllabus.find(t => t.id === item.topicId);
    const topicName = topic?.name || item.topicName || 'Tópico';
    const sub = item.subtopicId ? (topic?.subtopics || []).find(st => st.id === item.subtopicId) : null;
    const label = sub ? `${topicName} • ${sub.name}` : topicName;
    const badge = item.type === 'theory' ? 'Teoria' : item.type === 'questions' ? 'Questões' : item.type === 'review' ? 'Revisão' : 'Videoaula';
    const qtxt = item.questionsTarget ? `${item.questionsTarget}q` : '';
    const ttxt = item.minutesTarget ? `${item.minutesTarget}min` : '';
    const meta = [badge, qtxt, ttxt].filter(Boolean).join(' • ');
    return `
      <div class="bg-white rounded-lg border border-gray-100 p-2 text-left mb-2">
        <div class="flex items-start justify-between gap-2">
          <button onclick="openTopicDetails('${item.topicId}')" class="text-left flex-1">
            <div class="text-xs font-semibold text-navy-900">${label}</div>
            <div class="text-[11px] text-gray-500 mt-0.5">${meta}</div>
          </button>
          <div class="flex items-center gap-1">
            <button onclick="setSessionPrefill('${item.topicId}','${item.subtopicId || ''}')" class="p-1 text-gray-400 hover:text-accent-600 hover:bg-gray-50 rounded transition" title="Iniciar sessão">
              ${icons.play}
            </button>
            <button onclick="deleteScheduleItem(${dayIndex}, '${item.id}')" class="p-1 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded transition" title="Remover">
              ${icons.trash}
            </button>
          </div>
        </div>
      </div>
    `;
  }

  return `
    <div class="p-6 fade-in">
      <div class="mb-6">
        <h1 class="text-2xl font-bold text-navy-900">Plano & Ciclo de Estudos</h1>
        <p class="text-gray-500">Configure seu cronograma e metas</p>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
          <h3 class="font-semibold text-navy-900 mb-4">Período Ativo do Concurso</h3>
          <p class="text-sm text-gray-500 mb-4">Defina se você está em pré-edital ou pós-edital. O sistema usa isso em relatórios e registros.</p>
          <div class="flex gap-3">
            <button onclick="setActiveContestMode('pre')" class="flex-1 p-4 rounded-xl border-2 transition ${activeMode === 'pre' ? 'border-accent-500 bg-accent-50' : 'border-gray-200 hover:border-gray-300'}">
              <div class="font-medium text-navy-900 mb-1">Pré-Edital</div>
              <p class="text-sm text-gray-500">Base teórica e constância</p>
            </button>
            <button onclick="setActiveContestMode('post')" class="flex-1 p-4 rounded-xl border-2 transition ${activeMode === 'post' ? 'border-accent-500 bg-accent-50' : 'border-gray-200 hover:border-gray-300'}">
              <div class="font-medium text-navy-900 mb-1">Pós-Edital</div>
              <p class="text-sm text-gray-500">Intensificação e prova</p>
            </button>
          </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
          <h3 class="font-semibold text-navy-900 mb-4">Modo de Estudo</h3>
          <div class="flex gap-3">
            <button onclick="setActiveContestMode('pre')" class="flex-1 p-4 rounded-xl border-2 transition ${activeMode === 'pre' ? 'border-accent-500 bg-accent-50' : 'border-gray-200 hover:border-gray-300'}">
              <div class="font-medium text-navy-900 mb-1">Pré-Edital</div>
              <p class="text-sm text-gray-500">Foco em base teórica e revisões</p>
            </button>
            <button onclick="setActiveContestMode('post')" class="flex-1 p-4 rounded-xl border-2 transition ${activeMode === 'post' ? 'border-accent-500 bg-accent-50' : 'border-gray-200 hover:border-gray-300'}">
              <div class="font-medium text-navy-900 mb-1">Pós-Edital</div>
              <p class="text-sm text-gray-500">Foco em questões e simulados</p>
            </button>
          </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
          <h3 class="font-semibold text-navy-900 mb-4">Metas Semanais</h3>
          <div class="space-y-4">
            <div>
              <label class="block text-sm text-gray-600 mb-2">Horas de Estudo</label>
              <input type="number" value="${plan.weeklyGoal || 20}" onchange="updatePlanGoal('weeklyGoal', this.value)" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-accent-500 focus:border-accent-500 outline-none">
            </div>
            <div>
              <label class="block text-sm text-gray-600 mb-2">Questões</label>
              <input type="number" value="${plan.questionGoal || 100}" onchange="updatePlanGoal('questionGoal', this.value)" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-accent-500 focus:border-accent-500 outline-none">
            </div>
          </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 lg:col-span-2">
          <div class="flex items-center justify-between mb-4">
            <h3 class="font-semibold text-navy-900">Cronograma Semanal</h3>
            <p class="text-xs text-gray-500">Clique no + para adicionar matéria/tópico/subtópico e tipo de estudo</p>
          </div>
          <div class="grid grid-cols-7 gap-2">
            ${days.map((day, i) => `
              <div class="text-center">
                <div class="text-xs font-medium text-gray-500 mb-2">${day}</div>
                <div class="bg-gray-50 rounded-lg p-2 min-h-24 border border-gray-100 text-left">
                  ${(activeSchedule[i] || []).map(item => renderScheduleItem(item, i)).join('')}
                  <button onclick="addScheduleItem(${i})" class="w-full text-center text-gray-400 hover:text-accent-600 transition py-1">
                    ${icons.plus}
                  </button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      </div>
    </div>
  `;
}

function renderReports(contest) {
  const sessions = contest.sessions || [];
  const questions = contest.questions || [];
  const syllabus = contest.syllabus || [];
  const view = getReportViewState(contest);
  const range = getReportRange(contest);
  const mode = getActiveContestMode(contest);

  const periodSessions = sessions.filter(s => (s.planMode || 'pre') === mode && isDateInRange(s.date, range.start, range.end));
  const periodQuestions = questions.filter(q => (q.planMode || 'pre') === mode && isDateInRange(q.date, range.start, range.end));

  const hoursByDiscipline = {};
  periodSessions.forEach(s => {
    const topic = syllabus.find(t => t.id === s.topicId);
    const discipline = topic?.parent || topic?.name || s.topicName || 'Outros';
    hoursByDiscipline[discipline] = (hoursByDiscipline[discipline] || 0) + (s.duration || 0);
  });

  const accuracyByDiscipline = {};
  periodQuestions.forEach(q => {
    const topic = syllabus.find(t => t.id === q.topicId);
    const discipline = topic?.parent || topic?.name || q.topicName || 'Geral';
    if (!accuracyByDiscipline[discipline]) accuracyByDiscipline[discipline] = { correct: 0, total: 0 };
    accuracyByDiscipline[discipline].correct += q.correct || 0;
    accuracyByDiscipline[discipline].total += q.total || 0;
  });

  const periodSeconds = periodSessions.reduce((acc, s) => acc + (s.duration || 0), 0);
  const periodQuestionsTotal = periodQuestions.reduce((acc, q) => acc + (q.total || 0), 0);
  const periodQuestionsCorrect = periodQuestions.reduce((acc, q) => acc + (q.correct || 0), 0);
  const periodAccuracy = periodQuestionsTotal > 0 ? Math.round((periodQuestionsCorrect / periodQuestionsTotal) * 100) : 0;

  const timePieData = Object.entries(hoursByDiscipline)
    .sort((a,b) => b[1] - a[1])
    .slice(0, 8)
    .map(([label, value]) => ({ label, value, display: formatTime(value) }));

  const questionPieData = Object.entries(accuracyByDiscipline)
    .filter(([, data]) => data.total > 0)
    .sort((a,b) => b[1].total - a[1].total)
    .slice(0, 8)
    .map(([label, data]) => ({ label, value: data.total, display: `${Math.round((data.correct / data.total) * 100)}%` }));

  const ranking = Object.entries(accuracyByDiscipline)
    .filter(([, data]) => data.total > 0)
    .map(([label, data]) => {
      const accuracy = Math.round((data.correct / data.total) * 100);
      const volumeFactor = Math.min(data.total / 10, 20);
      return { label, accuracy, total: data.total, score: Number((accuracy + volumeFactor).toFixed(1)) };
    })
    .sort((a,b) => b.score - a.score);

  const periodTopicIds = new Set([
    ...periodSessions.map(s => s.topicId).filter(Boolean),
    ...periodQuestions.map(q => q.topicId).filter(Boolean)
  ]);
  const criticalTopics = syllabus
    .filter(t => periodTopicIds.has(t.id) || (t.questions || 0) > 0 || (t.accuracy || 0) > 0)
    .filter(t => (t.accuracy || 0) < 60)
    .sort((a,b) => (a.accuracy || 0) - (b.accuracy || 0))
    .slice(0, 5);

  const maxHours = Math.max(...Object.values(hoursByDiscipline), 1);
  const periodLabel = view.periodType === 'month' ? 'no mês' : view.periodType === 'custom' ? 'no período' : 'na semana';
  const previousLabel = view.periodType === 'month' ? '← Mês' : view.periodType === 'custom' ? '← Período' : '← Semana';
  const nextLabel = view.periodType === 'month' ? 'Mês →' : view.periodType === 'custom' ? 'Período →' : 'Semana →';

  const calendarBase = new Date(range.calendarDate);
  const calendarStart = new Date(calendarBase.getFullYear(), calendarBase.getMonth(), 1);
  const calendarEnd = new Date(calendarBase.getFullYear(), calendarBase.getMonth() + 1, 0);
  const firstWeekday = calendarStart.getDay();
  const daysInMonth = calendarEnd.getDate();
  const todayIso = toISODateOnly(new Date());
  const activityByDay = {};
  const allModeSessions = sessions.filter(s => (s.planMode || 'pre') === mode);
  const allModeQuestions = questions.filter(q => (q.planMode || 'pre') === mode);
  allModeSessions.forEach(s => {
    const iso = toISODateOnly(s.date);
    if (!activityByDay[iso]) activityByDay[iso] = { sessions: 0, seconds: 0, questions: 0, correct: 0 };
    activityByDay[iso].sessions += 1;
    activityByDay[iso].seconds += s.duration || 0;
  });
  allModeQuestions.forEach(q => {
    const iso = toISODateOnly(q.date);
    if (!activityByDay[iso]) activityByDay[iso] = { sessions: 0, seconds: 0, questions: 0, correct: 0 };
    activityByDay[iso].questions += q.total || 0;
    activityByDay[iso].correct += q.correct || 0;
  });
  const calendarCells = [];
  for (let i = 0; i < firstWeekday; i++) calendarCells.push(`<div class="min-h-[112px] bg-gray-50/60 border border-gray-100 rounded-lg"></div>`);
  for (let day = 1; day <= daysInMonth; day++) {
    const d = new Date(calendarStart.getFullYear(), calendarStart.getMonth(), day);
    const iso = toISODateOnly(d);
    const activity = activityByDay[iso];
    const inRange = d >= range.start && d < range.end;
    const hasActivity = activity && (activity.sessions > 0 || activity.questions > 0 || activity.seconds > 0);
    calendarCells.push(`
      <button onclick="${hasActivity ? `showReportDayDetails('${iso}')` : ''}" class="min-h-[112px] text-left border rounded-lg p-3 transition ${inRange ? 'border-accent-200 bg-accent-50/40' : 'border-gray-100 bg-white'} ${hasActivity ? 'hover:shadow-md hover:border-accent-400 cursor-pointer' : 'cursor-default'} ${iso === todayIso ? 'ring-2 ring-accent-400' : ''}">
        <div class="flex items-center justify-between mb-2">
          <span class="text-sm font-semibold ${iso === todayIso ? 'text-accent-600' : 'text-gray-600'}">${day}</span>
          ${hasActivity ? '<span class="w-3 h-3 rounded-full bg-green-500"></span>' : ''}
        </div>
        ${hasActivity ? `
          <div class="mt-4 space-y-1 text-xs text-navy-700">
            <div class="flex items-center gap-1">${icons.book}<span>${activity.sessions} ativ.</span></div>
            <div class="flex items-center gap-1">${icons.clock}<span>${formatTime(activity.seconds)}</span></div>
            ${activity.questions > 0 ? `<div class="flex items-center gap-1">${icons.question}<span>${activity.questions} quest.</span></div>` : ''}
          </div>
        ` : ''}
      </button>
    `);
  }

  return `
    <div class="p-6 fade-in">
      <div class="mb-6 flex flex-col xl:flex-row xl:items-center xl:justify-between gap-4">
        <div>
          <h1 class="text-2xl font-bold text-navy-900">Relatórios</h1>
          <p class="text-gray-500">Análise detalhada do seu desempenho</p>
        </div>
        <div class="flex flex-wrap gap-2">
          <button onclick="setActiveContestMode('pre')" class="px-4 py-2 rounded-lg text-sm font-medium border ${mode === 'pre' ? 'bg-accent-600 text-white border-accent-600' : 'bg-white text-navy-700 border-gray-200 hover:bg-gray-50'}">Pré-edital</button>
          <button onclick="setActiveContestMode('post')" class="px-4 py-2 rounded-lg text-sm font-medium border ${mode === 'post' ? 'bg-accent-600 text-white border-accent-600' : 'bg-white text-navy-700 border-gray-200 hover:bg-gray-50'}">Pós-edital</button>
          <button onclick="setReportPeriodType('week')" class="px-4 py-2 rounded-lg text-sm font-medium border ${view.periodType === 'week' ? 'bg-navy-900 text-white border-navy-900' : 'bg-white text-navy-700 border-gray-200 hover:bg-gray-50'}">Semana</button>
          <button onclick="setReportPeriodType('month')" class="px-4 py-2 rounded-lg text-sm font-medium border ${view.periodType === 'month' ? 'bg-navy-900 text-white border-navy-900' : 'bg-white text-navy-700 border-gray-200 hover:bg-gray-50'}">Mês</button>
          <button onclick="setReportPeriodType('custom')" class="px-4 py-2 rounded-lg text-sm font-medium border ${view.periodType === 'custom' ? 'bg-navy-900 text-white border-navy-900' : 'bg-white text-navy-700 border-gray-200 hover:bg-gray-50'}">Período manual</button>
        </div>
      </div>

      <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 mb-6">

            <button onclick="resetReportPeriod()" class="px-4 py-2 rounded-lg text-sm font-medium bg-white text-navy-700 border border-gray-200 hover:bg-gray-50">Hoje</button>

    function showModal(content) {
      let container = document.getElementById('modal-container');
      if (!container) {
        container = document.createElement('div');
        container.id = 'modal-container';
        document.body.appendChild(container);
      }
      container.innerHTML = `
        <div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4" onclick="closeModal(event)">
          <div class="bg-white rounded-2xl shadow-xl max-w-md w-full max-h-[90%] overflow-auto" onclick="event.stopPropagation()">
            ${content}
          </div>
        </div>
      `;
    }

    function closeModal(event) {
      if (event && event.target !== event.currentTarget) return;
      const container = document.getElementById('modal-container');
      if (container) container.innerHTML = '';
    }

function createSyllabusTemplate(event) {
  event.preventDefault();
  const profile = getCurrentProfile();
  if (!profile) return;
  profile.syllabusTemplates = profile.syllabusTemplates || [];
  const area = normalizeAreaName(document.getElementById('template-area')?.value || state.currentSyllabusArea || 'Geral');
  const template = {
    id: generateId(),
    area,
    name: document.getElementById('template-name').value.trim(),
    organization: document.getElementById('template-org').value.trim(),
    createdAt: new Date().toISOString(),
    topics: []
  };
  profile.syllabusTemplates.unshift(template);
  state.profileSyllabusLibraryOpen = true;
  state.currentSyllabusTemplateId = template.id;
  saveToStorage();
  closeModal();
  render();
}

function deleteSyllabusTemplate(templateId) {
  if (!confirm('Excluir este concurso-modelo do banco de editais?')) return;
  const profile = getCurrentProfile();
  if (!profile) return;
  profile.syllabusTemplates = (profile.syllabusTemplates || []).filter(t => t.id !== templateId);
  if (state.currentSyllabusTemplateId === templateId) state.currentSyllabusTemplateId = null;
  saveToStorage();
  render();
}

function addTemplateTopic(event, templateId) {
  event.preventDefault();
  const templates = getSyllabusTemplates();
  const template = templates.find(t => t.id === templateId);
  if (!template) return;
  const lines = (document.getElementById('template-subtopics').value || '')
    .split('\n')
    .map(line => line.trim())
    .filter(Boolean);
  const topic = {
    id: generateId(),
    name: document.getElementById('template-topic-name').value.trim(),
    parent: document.getElementById('template-topic-parent').value.trim() || null,
    priority: document.getElementById('template-topic-priority').value,
    weight: parseInt(document.getElementById('template-topic-weight').value || '3', 10),
    subtopics: lines.map(line => ({
      id: generateId(),
      name: line.replace(/^\d+(\.\d+)*\s*[-.)]?\s*/, '').trim() || line,
      priority: 'medium',
      status: 'pending',
      questions: 0,
      accuracy: 0,
      timeSpent: 0,
      nextReview: null
    }))
  };
  template.topics = template.topics || [];
  template.topics.push(topic);
  saveToStorage();
  closeModal();
  render();
}

function toggleTemplateImportTopic(topicId) {
  const topicCheckbox = document.querySelector(`.template-import-topic[data-topic-id="${topicId}"]`);
  const subCheckboxes = Array.from(document.querySelectorAll(`.template-import-subtopic[data-topic-id="${topicId}"]`));
  subCheckboxes.forEach(cb => { cb.checked = !!topicCheckbox?.checked; });
}

function refreshTemplateImportTopicCheck(topicId) {
  const topicCheckbox = document.querySelector(`.template-import-topic[data-topic-id="${topicId}"]`);
  const subCheckboxes = Array.from(document.querySelectorAll(`.template-import-subtopic[data-topic-id="${topicId}"]`));
  if (!topicCheckbox || subCheckboxes.length === 0) return;
  const checkedCount = subCheckboxes.filter(cb => cb.checked).length;
  topicCheckbox.checked = checkedCount === subCheckboxes.length;
  topicCheckbox.indeterminate = checkedCount > 0 && checkedCount < subCheckboxes.length;
}

function toggleAllTemplateImportSelection(checked) {
  document.querySelectorAll('.template-import-topic, .template-import-subtopic').forEach(cb => {
    cb.checked = checked;
    cb.indeterminate = false;
  });
}

function getSelectedTemplateImportTopics(template) {
  const topicCheckboxes = Array.from(document.querySelectorAll('.template-import-topic'));
  const subCheckboxes = Array.from(document.querySelectorAll('.template-import-subtopic'));
  const anySelected = topicCheckboxes.some(cb => cb.checked) || subCheckboxes.some(cb => cb.checked);
  if (!anySelected) return template.topics || [];

  return (template.topics || []).map(topic => {
    const topicChecked = topicCheckboxes.some(cb => cb.dataset.topicId === topic.id && cb.checked);
    const checkedSubIds = subCheckboxes
      .filter(cb => cb.dataset.topicId === topic.id && cb.checked)
      .map(cb => cb.dataset.subtopicId);

    if (topicChecked) return { ...topic, subtopics: topic.subtopics || [] };
    if (checkedSubIds.length > 0) {
      return {
        ...topic,
        subtopics: (topic.subtopics || []).filter(st => checkedSubIds.includes(st.id))
      };
    }
    return null;
  }).filter(Boolean);
}

function importSyllabusTemplate(eventOrTemplateId, maybeTemplateId = null) {
  if (eventOrTemplateId && typeof eventOrTemplateId.preventDefault === 'function') eventOrTemplateId.preventDefault();
  const templateId = maybeTemplateId || eventOrTemplateId;
  const profile = getCurrentProfile();
  const targetContestId = document.getElementById('target-contest-id')?.value || state.currentContest;
  const contest = profile?.contests?.find(c => c.id === targetContestId);
  const template = (profile?.syllabusTemplates || []).find(t => t.id === templateId);
  if (!contest || !template) return;
  contest.area = contest.area || getTemplateArea(template);

  const selectedTopics = getSelectedTemplateImportTopics(template);
  const fullImport = selectedTopics.length === (template.topics || []).length && selectedTopics.every(t => {
    const original = (template.topics || []).find(orig => orig.id === t.id);
    return (t.subtopics || []).length === (original?.subtopics || []).length;
  });
  const confirmMessage = fullImport
    ? `Importar todo o edital de "${template.name}" para o concurso "${contest.name}"?`
    : `Importar ${selectedTopics.length} matéria(s) selecionada(s) do edital "${template.name}" para o concurso "${contest.name}"?`;
  if (!confirm(confirmMessage)) return;

  contest.syllabus = contest.syllabus || [];
  selectedTopics.forEach(t => {
    const newTopicId = generateId();
    contest.syllabus.push({
      id: newTopicId,
      name: t.name,
      parent: t.parent || null,
      priority: t.priority || 'medium',
      weight: t.weight || 3,
      status: 'pending',
      questions: 0,
      accuracy: 0,
      timeSpent: 0,
      nextReview: null,
      subtopics: (t.subtopics || []).map(st => ({
        id: generateId(),
        name: st.name,
        priority: st.priority || 'medium',
        status: 'pending',
        questions: 0,
        accuracy: 0,
        timeSpent: 0,
        nextReview: null
      }))
    });
  });
  saveToStorage();
  alert(fullImport ? 'Edital importado com sucesso para o concurso selecionado.' : 'Conteúdo selecionado importado com sucesso para o concurso selecionado.');
  closeModal();
  render();
}

    // Timer functions (drift-free; accurate even when switching tabs)
    function getTimerElapsedSeconds() {
      if (state.timerRunning && state.timerStartEpoch) {
        const live = Math.floor((Date.now() - state.timerStartEpoch) / 1000);
        return state.timerAccumulatedSeconds + Math.max(0, live);
      }
      return state.timerAccumulatedSeconds;
    }

    function updateTimerDisplay() {
      state.timerSeconds = getTimerElapsedSeconds();
      const display = document.getElementById('timer-display');
      if (display) display.textContent = formatTime(state.timerSeconds);
    }

    function startTimer() {
      if (state.timerRunning) return;
      state.timerRunning = true;
      state.timerStartEpoch = Date.now();
      // Use a short tick; elapsed time is computed from timestamps so it won't drift when the tab is inactive
      state.timerInterval = setInterval(updateTimerDisplay, 250);
      updateTimerDisplay();
      render();
    }

    function pauseTimer() {
      if (!state.timerRunning) return;
      state.timerAccumulatedSeconds = getTimerElapsedSeconds();
      state.timerRunning = false;
      state.timerStartEpoch = null;
      clearInterval(state.timerInterval);
      updateTimerDisplay();
      render();
    }

    function stopTimer() {
      const elapsed = getTimerElapsedSeconds();
      if (elapsed === 0) return;

      pauseTimer();

      const profile = state.profiles.find(p => p.id === state.currentProfile);
      const contest = profile?.contests?.find(c => c.id === state.currentContest);
      if (!contest) return;

      const topicSelect = document.getElementById('session-topic');
      const subtopicSelect = document.getElementById('session-subtopic');
      const typeSelect = document.getElementById('session-type');
      const topicId = topicSelect?.value || null;
      const subtopicId = subtopicSelect?.value || null;
      const topic = contest.syllabus?.find(t => t.id === topicId);
      const subtopic = (topic && subtopicId) ? (topic.subtopics || []).find(st => st.id === subtopicId) : null;

      const session = {
        id: generateId(),
        topicId,
        topicName: topic?.name || 'Sem tópico',
        subtopicId,
        subtopicName: subtopic?.name || null,
        type: typeSelect?.value || 'theory',
        duration: elapsed,
        date: new Date().toISOString(),
        planMode: getActiveContestMode(contest)
      };

      contest.sessions = contest.sessions || [];
      contest.sessions.unshift(session);

      // Update topic time (stored in minutes)
      if (topic) {
        topic.timeSpent = (topic.timeSpent || 0) + Math.round(elapsed / 60);
        topic.lastStudied = new Date().toISOString();

        // Update subtópico time (stored in minutes)
        if (subtopic) {
          subtopic.timeSpent = (subtopic.timeSpent || 0) + Math.round(elapsed / 60);
          subtopic.lastStudied = new Date().toISOString();
        }

        // Create review if theory study
        if (typeSelect?.value === 'theory') {
          const intervals = contest.reviewSettings?.intervals || [1, 7, 30];
          const reviewDate = new Date();
          reviewDate.setDate(reviewDate.getDate() + intervals[0]);

          createManualReview(contest, topicId, subtopic ? subtopic.id : null, reviewDate.toISOString());
        }
      }

      state.timerSeconds = 0;
      state.timerAccumulatedSeconds = 0;
      state.timerStartEpoch = null;
      state.sessionPrefill = { topicId: null, subtopicId: null };
      saveToStorage();
      render();
    }

    // Keep timer display accurate when switching tabs/windows
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        updateTimerDisplay();
      }
    });

function saveScheduleItem(event, dayIndex) {
  event.preventDefault();
  const contest = getCurrentContest();
  if (!contest) return;
  contest.plan = contest.plan || {};
  contest.plan.schedules = contest.plan.schedules || {
    pre: {0:[],1:[],2:[],3:[],4:[],5:[],6:[]},
    post:{0:[],1:[],2:[],3:[],4:[],5:[],6:[]}
  };
  const mode = getActiveContestMode(contest);
  const schedule = contest.plan.schedules[mode] || (contest.plan.schedules[mode] = {0:[],1:[],2:[],3:[],4:[],5:[],6:[]});

  const topicId = document.getElementById('schedule-topic').value || null;
  const topic = getTopicById(contest, topicId);
  const subtopicId = document.getElementById('schedule-subtopic').value || null;
  const sub = subtopicId ? getSubtopicById(topic, subtopicId) : null;

  schedule[dayIndex] = schedule[dayIndex] || [];
  schedule[dayIndex].push({
    id: generateId(),
    topicId,
    topicName: topic?.name || null,
    subtopicId: sub ? sub.id : null,
    subtopicName: sub ? sub.name : null,
    type: document.getElementById('schedule-type').value,
    questionsTarget: parseInt(document.getElementById('schedule-questions').value) || 0,
    minutesTarget: parseInt(document.getElementById('schedule-minutes').value) || 0,
    notes: document.getElementById('schedule-notes').value.trim() || ''
  });

  saveToStorage();
  closeModal();
  render();
}

function deleteScheduleItem(dayIndex, itemId) {
  const contest = getCurrentContest();
  if (!contest?.plan?.schedules) return;
  const mode = getActiveContestMode(contest);
  const schedule = contest.plan.schedules[mode] || (contest.plan.schedules[mode] = {0:[],1:[],2:[],3:[],4:[],5:[],6:[]});
  schedule[dayIndex] = (schedule[dayIndex] || []).filter(i => i.id !== itemId);
  saveToStorage();
  render();
}

    function normalizeImportedSyllabusTemplates(rawTemplates, existingTemplates = []) {
      const existingIds = new Set((existingTemplates || []).map(t => t.id));
      const usedIds = new Set(existingIds);

      function ensureId(oldId) {
        if (!oldId || usedIds.has(oldId)) {
          const newId = generateId();
          usedIds.add(newId);
          return newId;
        }
        usedIds.add(oldId);
        return oldId;
      }

      return (rawTemplates || []).map(template => {
        const newTemplate = {
          ...template,
          id: ensureId(template.id),
          area: normalizeAreaName(template.area || template.careerArea || template.category),
          name: template.name || 'Concurso-modelo importado',
          organization: template.organization || '',
          importedAt: new Date().toISOString(),
          topics: (template.topics || []).map(topic => ({
            ...topic,
            id: ensureId(topic.id),
            name: topic.name || 'Matéria importada',
            parent: topic.parent || null,
            priority: topic.priority || 'medium',
            weight: topic.weight || 3,
            subtopics: (topic.subtopics || []).map(subtopic => ({
              ...subtopic,
              id: ensureId(subtopic.id),
              name: subtopic.name || 'Subtópico importado',
              priority: subtopic.priority || 'medium',
              status: subtopic.status || 'pending',
              questions: subtopic.questions || 0,
              accuracy: subtopic.accuracy || 0,
              timeSpent: subtopic.timeSpent || 0,
              nextReview: subtopic.nextReview || null
            }))
          }))
        };
        return newTemplate;
      });
    }

    function importSyllabusTemplates() {
      const profile = getCurrentProfile();
      if (!profile) {
        alert('Selecione um perfil antes de importar o Banco de Editais.');
        return;
      }

      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json,application/json';
      input.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            const rawTemplates = Array.isArray(data)
              ? data
              : (data.templates || data.syllabusTemplates || data.bancoEditais || []);

            if (!Array.isArray(rawTemplates) || rawTemplates.length === 0) {
              throw new Error('Arquivo sem modelos de edital.');
            }

            profile.syllabusTemplates = profile.syllabusTemplates || [];
            const replace = confirm('Deseja SUBSTITUIR o Banco de Editais atual?\n\nOK = substituir tudo\nCancelar = mesclar com o banco atual');

            if (replace) {
              profile.syllabusTemplates = normalizeImportedSyllabusTemplates(rawTemplates, []);
            } else {
              const imported = normalizeImportedSyllabusTemplates(rawTemplates, profile.syllabusTemplates);
              profile.syllabusTemplates = [...imported, ...profile.syllabusTemplates];
            }

            state.profileSyllabusLibraryOpen = true;
            state.currentSyllabusArea = null;
            state.currentSyllabusTemplateId = null;

    function downloadJSON(data, filename) {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function importData() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            
            if (data.profiles) {
              // Full backup
              state.profiles = data.profiles;
            } else if (data.type === 'profile' && data.profile) {
              // Single profile
              data.profile.id = generateId(); // Generate new ID to avoid conflicts
              state.profiles.push(data.profile);
            } else if (data.type === 'contest' && data.contest && state.currentProfile) {
              // Single contest
              const profile = state.profiles.find(p => p.id === state.currentProfile);
              if (profile) {
                data.contest.id = generateId();
                profile.contests = profile.contests || [];
                profile.contests.push(data.contest);
              }
            }
            
            saveToStorage();
            render();
            
            showModal(`
              <div class="p-6 text-center">
                <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4 text-green-600">
                  ${icons.check}

                <button onclick="closeModal()" class="px-6 py-2 bg-accent-600 text-white rounded-lg hover:bg-accent-700 transition font-medium">OK</button>
              </div>
            `);

                <button onclick="closeModal()" class="px-6 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition font-medium">Fechar</button>
              </div>
            `);
          }
        };
        reader.readAsText(file);
      };
      input.click();
    }

    function restoreFromTrash(id) {
      const profile = state.profiles.find(p => p.id === state.currentProfile);
      const contest = profile?.contests?.find(c => c.id === state.currentContest);
      if (!contest || !contest.trash) return;
      
      const itemIndex = contest.trash.findIndex(t => t.id === id);
      if (itemIndex === -1) return;
      
      const item = contest.trash.splice(itemIndex, 1)[0];
      delete item.deletedAt;
      contest.syllabus = contest.syllabus || [];
      contest.syllabus.push(item);
      
      saveToStorage();
      render();
    }
